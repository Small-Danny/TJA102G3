<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商店｜產品列表</title>

  <!-- CSS -->
  <link th:href="@{/frontend-template/assets/css/bootstrap.min.css}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/images/heading-icon.png}" rel="icon" type="image/x-icon" />
  <link th:href="@{/frontend-template/assets/font/flaticon_mycollection.html}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/css/owl.carousel.min.css}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/css/owl.theme.default.min.css}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/css/jquery.fancybox.min.css}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/css/fontawesome.min.css}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/css/nice-select.css}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/css/style.css}" rel="stylesheet" />
  <link th:href="@{/frontend-template/assets/css/responsive.css}" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/frontend-template/assets/css/header.css}">
  <link rel="stylesheet" th:href="@{/frontend-template/assets/css/productlist.css}">

  <!-- 若你尚未加入尺寸徽章樣式，可保留這段；已經有就可刪除 -->
  <style>
    .size-chips{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.25rem}
    .size-chip{display:inline-block;padding:.2rem .5rem;border-radius:999px;font-size:.85rem;border:1px solid #ddd}
    .size-chip-on{color:#0f5132;background:#d1e7dd;border-color:#badbcc}
    .size-chip-off{color:#6c757d;background:#f1f3f5;border-color:#e9ecef}
  </style>
</head>
<body>
  <!-- header -->
  <div id="header-placeholder"></div>

  <!-- Banner -->
  <section class="banner-style-one">
    <div class="parallax"></div>
    <div class="container">
      <div class="row">
        <div class="banner-details">
          <h2>商店</h2>
          <p>我們的價值觀讓我們躍升至行業頂端。</p>
        </div>
      </div>
    </div>
    <div class="breadcrums">
      <div class="container">
        <div class="row">
          <ul>
            <li>
              <a th:href="@{/index.html}">
                <i class="fa-solid fa-house"></i><p>首頁</p>
              </a>
            </li>
            <li class="current"><p>商品列表</p></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- Shop -->
  <section class="gap shop-style-one addition">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="shop-filter">
            <p th:if="${products != null}">
              <span th:text="${#lists.size(products)}">0</span> Products
            </p>
            <div class="gird-list d-flex-all">
              <a class="d-flex-all list" href="javascript:void(0)"><i class="fa-solid fa-list"></i></a>
              <a class="d-flex-all grid" href="javascript:void(0)"><i class="fa-solid fa-table-list"></i></a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 商品卡片區 -->
    <div class="container">
      <div class="row p-slider align-items-center justify-content-between grid" id="product-grid">
        <!-- 迴圈渲染商品 -->
        <div class="col-lg-4 col-md-6 mb-4 product-item"
             th:each="p : ${products}"
             th:with="pic=${p.productPicture},
                      name=${(pic == null or pic.isEmpty()) ? 'placeholder.png' : (pic.contains('/') ? pic.substring(pic.lastIndexOf('/') + 1) : pic)}">
          <div class="product">
            <div class="main-data">
              <div class="btn-hover">
                <figure>
                  <!-- http/https 完整網址 -->
                  <img th:if="${pic != null and #strings.startsWith(pic, 'http')}"
                       th:src="${pic}" th:alt="${p.productName}" loading="lazy" width="336" height="216" />
                  <!-- 靜態目錄圖片 -->
                  <img th:if="${pic == null or !#strings.startsWith(pic, 'http')}"
                       th:src="@{/frontend-template/assets/img/{f}(f=${name})}"
                       th:alt="${p.productName}" loading="lazy" width="336" height="216" />
                </figure>
                <a class="theme-btn" th:href="@{/shop/product/{id}(id=${p.productId})}">
                  See more Detail <i class="fa-solid fa-arrow-right"></i>
                </a>
              </div>

              <!-- 這層定義 chips，下面都能用 -->
              <div class="data" th:with="chips=${@productService.sizeChipsForList(p)}">
                <div class="ratings"><i class="fa-solid fa-star"></i><span>5.0</span></div>
                <h3>
                  <a th:text="${@productService.displayNameWithoutSize(p)}"
                     th:href="@{/shop/product/{id}(id=${p.productId})}">商品名稱</a>
                </h3>

                <!-- 價格區間 -->
                <div class="price-range" th:with="pr=${@productService.priceRangeFor(p)}">
                  <span th:if="${pr != null}">
                    <span th:if="${pr.min == pr.max}">
                      NT$ <span th:text="${#numbers.formatInteger(pr.min, 3, 'COMMA')}">0</span>
                    </span>
                    <span th:if="${pr.min != pr.max}">
                      NT$ <span th:text="${#numbers.formatInteger(pr.min, 3, 'COMMA')}">0</span>
                      - <span th:text="${#numbers.formatInteger(pr.max, 3, 'COMMA')}">0</span>
                    </span>
                  </span>
                  <span th:if="${pr == null}">
                    NT$ <span th:text="${#numbers.formatInteger(p.productPrice, 3, 'COMMA')}">0</span>
                  </span>
                </div>

                <!-- 尺寸框（與內頁一致的框框風格） -->
				<div class="size-options"
				     th:with="chips=${@productService.sizeChipsForList(p)}"
				     th:if="${chips != null and !#lists.isEmpty(chips)}">
				
				  <!-- 可售（上架且庫存>0）→ 紅色；不可售（下架或庫存=0）→ 灰色 -->
				  <a th:each="c : ${chips}"
				     th:href="@{/shop/product/{id}(id=${c.productId})}"
				     th:text="${c.label == '1' ? '均碼' : c.label}"
				     th:class="'size-btn ' + (${c.available} ? 'on' : 'off')"
				     th:attr="aria-disabled=${!c.available}">
				  </a>
				</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 若沒有商品時顯示 -->
        <div class="col-12" id="empty-tip" th:if="${products == null or #lists.isEmpty(products)}">
          <div class="alert alert-light text-center">目前沒有商品</div>
        </div>
      </div>
    </div>

    <!-- 分頁列 -->
    <div class="container">
      <div class="row">
        <div class="gym-pagination">
          <nav aria-label="Page navigation">
            <ul class="pagination" id="pagination"></ul>
          </nav>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- JS -->
  <script th:src="@{/frontend-template/assets/js/jquery.min.js}"></script>
  <script th:src="@{/frontend-template/assets/js/bootstrap.min.js}"></script>
  <script th:src="@{/frontend-template/assets/js/jquery.fancybox.min.js}"></script>
  <script th:src="@{/frontend-template/assets/js/jquery.nice-select.js}"></script>
  <script th:src="@{/frontend-template/assets/js/owl.carousel.min.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script th:src="@{/frontend-template/assets/js/loader.js}"></script>
  <script th:src="@{/frontend-template/assets/js/custom.js}"></script>
  <script th:src="@{/frontend-template/assets/js/api.js}"></script>
  <script th:src="@{/frontend-template/assets/js/cart.js}"></script>
  <script th:src="@{/frontend-template/assets/js/productlist.js}"></script>
  <script th:src="@{/frontend-template/assets/js/productdetail.js}"></script>
</body>
</html>
