<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
  th:replace="~{admin/layout :: layout(~{::title}, ~{::#pageContent}, ~{::#pageScripts})}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任務資料管理 - select_page</title>

  <!-- 將原檔 head 內的樣式保留於此（避免 head 巢狀）。如需可抽成獨立 CSS。 -->
  <style>
    :root {
      --card-bg: #fff;
      --card-border: #dee2e6;
      --muted: #6c757d;
      --soft: #f8f9fa;
    }

    .container-wide {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: .5rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    }

    .card-header {
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card-body {
      padding: 1rem;
    }

    .card-footer {
      padding: .75rem 1rem;
      border-top: 1px solid var(--card-border);
      background: var(--soft);
    }

    .grid-main {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 1rem;
    }

    @media (max-width: 992px) {
      .grid-main {
        grid-template-columns: 1fr;
      }
    }

    .form-grid {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: .5rem .75rem;
      align-items: center;
    }

    .form-grid.noselect {
      grid-template-columns: 150px 220px auto;
    }

    @media (max-width: 768px) {

      .form-grid,
      .form-grid.noselect {
        grid-template-columns: 1fr;
      }
    }

    .form-grid label {
      font-weight: 600;
      display: flex;
      align-items: center;
      height: 100%;
    }

    .form-grid input[type=text],
    .form-grid select {
      width: 100%;
      padding: .375rem .5rem;
      border: 1px solid #e9ecef;
      border-radius: .375rem;
    }

    .btn {
      display: inline-block;
      padding: .375rem .75rem;
      border: 1px solid #198754;
      color: #198754;
      background: #fff;
      border-radius: .375rem;
      text-decoration: none;
      font-size: .9rem;
      cursor: pointer;
    }

    .btn:hover {
      background: #198754;
      color: #fff;
    }

    .btn-secondary {
      border-color: #6c757d;
      color: #6c757d;
    }

    .btn-secondary:hover {
      background: #6c757d;
      color: #fff;
    }

    .hint {
      color: var(--muted);
      font-size: .9rem;
    }

    .errorblock {
      color: #dc3545;
      margin: .25rem 0 .75rem 0;
    }

    .list-links {
      list-style: none;
      padding-left: 1rem;
      margin: 0;
    }

    .list-links li {
      margin: .25rem 0;
    }

    .divider-soft {
      height: 1px;
      background: #eef1f4;
      margin: .5rem 0 1rem 0;
    }
  </style>
</head>

<!-- 內容容器：會被 layout.html 的 <div th:replace="${content}"> 放入 <main class="app-main"> -->
<div id="pageContent">
  <main class="container-wide">
    <div class="grid-main mt-3">
      <!-- 左側：查詢/導航卡片 -->
      <section class="card query-card">
        <header class="card-header">
          <h3 class="card-title">資料查詢　　　　　　　　</h3>
          <a class="btn btn-secondary" th:href="@{/admin/tasks/addTask}">新增任務</a>
        </header>
        <div class="card-body">
          <!-- 錯誤訊息 -->
          <div class="errorblock" th:utext="${errorMessage}"></div>

          <!-- 快速連結 -->
          <ul class="list-links">
            <li>
              <a class="btn" th:href="@{/admin/tasks/listAllTask}">瀏覽所有任務</a>
              <span class="hint">（List all Tasks）</span>
            </li>
          </ul>

          <div class="divider-soft"></div>

          <!-- 以任務ID（輸入）查單筆 -->
          <form class="form-grid noselect" method="post" th:action="@{/admin/tasks/getOne_For_Display}">
            <label>輸入任務ID</label>
            <input type="text" name="taskId" th:value="${param.taskId}" placeholder="例如：1" />
            <button type="submit" class="btn">送出</button>
          </form>

          <!-- 以任務ID（下拉）查單筆 -->
          <form class="form-grid mt-3" method="post" th:action="@{/admin/tasks/getOne_For_Display}">
            <label>選擇任務ID</label>
            <select name="taskId">
              <option th:each="taskVO : ${taskListData}" th:value="${taskVO.taskId}" th:text="${taskVO.taskId}">
              </option>
            </select>
            <button type="submit" class="btn">送出</button>
          </form>

          <!-- 以任務名稱（下拉）查單筆 -->
          <form class="form-grid mt-3" method="post" th:action="@{/admin/tasks/getOne_For_Display}">
            <label>選擇任務名稱</label>
            <select name="taskId">
              <option th:each="taskVO : ${taskListData}" th:value="${taskVO.taskId}" th:text="${taskVO.taskName}">
              </option>
            </select>
            <button type="submit" class="btn">送出</button>
          </form>
        </div>
      </section>

      <!-- 右側：單筆預覽卡片（沿用你原本的 listOneTask 片段） -->
      <aside class="card" th:if="${taskVO != null}">
        <header class="card-header">
          <h3 class="card-title">單筆任務預覽</h3>
          <a class="btn btn-secondary" th:href="@{/admin/tasks/select_page}">清除預覽</a>
        </header>
        <div class="card-body">
          <div th:insert="~{/admin/task/listOneTask :: listOneTask-div}"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<!-- 這頁才需要的腳本（可留空；會被 layout.html 以 <th:block th:replace="${pageScripts}"> 插入） -->
<th:block id="pageScripts">
  <!-- <script th:src="@{/js/tasks-select-page.js}"></script> -->
</th:block>

</html>
