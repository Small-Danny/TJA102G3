<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::content}, ~{::#empty-scripts})}">
<head>
  <title>商品詳細</title>
</head>
<body>
<div th:fragment="content">

  <div class="app-content-header">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6">
          <h3 class="mb-0">商品詳細</h3>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-end">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/products}">商品清單</a></li>
            <li class="breadcrumb-item active" aria-current="page">詳細</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">基本資訊</h3>
        </div>

        <div class="card-body">
          <dl class="row">

            <!-- 圖片 -->
            <dt class="col-sm-3">圖片</dt>
            <dd class="col-sm-9">
              <img th:if="${productVO != null and productVO.productPicture != null}"
                   th:src="@{/frontend-template/assets/img/{file}(file=${productVO.productPicture})}"
                   alt="商品圖片" class="img-fluid rounded shadow-sm"
                   style="max-width:260px;max-height:260px;object-fit:cover;">
              <img th:if="${productVO == null or productVO.productPicture == null}"
                   th:src="@{/frontend-template/assets/img/default.png}"
                   alt="商品圖片" class="img-fluid rounded shadow-sm"
                   style="max-width:260px;max-height:260px;object-fit:cover;">
            </dd>

            <dt class="col-sm-3">ID</dt>
            <dd class="col-sm-9" th:text="${productVO?.productId}">—</dd>

            <dt class="col-sm-3">名稱</dt>
            <dd class="col-sm-9" th:text="${productVO?.productName}">—</dd>

            <dt class="col-sm-3">代碼</dt>
            <dd class="col-sm-9" th:text="${productVO?.productCode}">—</dd>

            <dt class="col-sm-3">價格</dt>
            <dd class="col-sm-9">
              NT$
              <span th:text="${productVO != null ? #numbers.formatDecimal(productVO.productPrice,1,'COMMA',0,'POINT') : '0'}">0</span>
            </dd>

            <dt class="col-sm-3">庫存</dt>
            <dd class="col-sm-9" th:text="${productVO?.stockQuantity}">—</dd>

            <dt class="col-sm-3">狀態</dt>
            <dd class="col-sm-9">
              <span class="badge bg-success" th:if="${productVO?.productStatus == 1}">上架</span>
              <span class="badge bg-secondary" th:if="${productVO?.productStatus != 1}">下架</span>
            </dd>

            <dt class="col-sm-3">描述</dt>
            <dd class="col-sm-9" th:text="${productVO?.productDescription}">—</dd>
            
            <dt class="col-sm-3">商品類別</dt>
			  <dd class="col-sm-9" th:switch="${product.productType}">
			      <span th:case="0">裝備類</span>
			      <span th:case="1">容器類</span>
			      <span th:case="2">蛋白粉類</span>
			      <span th:case="*">未知</span>
			  </dd>
			  
			</tr>
          </dl>
        </div>

        <div class="card-footer d-flex gap-2">
          <a th:href="@{/admin/products}" class="btn btn-secondary">回清單</a>

          <a class="btn btn-warning"
             th:href="@{/admin/products/{id}/edit(id=${productVO.productId})}">
            編輯
          </a>

          <form th:action="@{/admin/products/{id}/delete(id=${productVO.productId})}"
                method="post" class="d-inline"
                onsubmit="return confirm('確定要刪除嗎？');">
            <button type="submit" class="btn btn-danger">刪除</button>
          </form>
        </div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
