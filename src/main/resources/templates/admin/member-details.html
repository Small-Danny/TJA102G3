<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{admin/layout :: layout(~{::title}, ~{::content}, ~{::#empty-scripts})}">

<head>
    <title th:text="'會員資料 | ' + ${user.name}">會員詳細資料</title>
</head>

<body>
    <div th:fragment="content">
        <div class="app-content">
            <div class="container-fluid">
                <div class="row">

                    <div class="col-lg-5">
                        <div class="card card-primary card-outline">
                            <div class="card-body box-profile">
                                <div class="text-center mb-4">
                                    <img class="profile-user-img img-fluid img-circle"
                                        th:src="${user.profilePicture != null ? '/' + user.profilePicture : '/images/default-avatar.png'}"
                                        alt="User profile picture"
                                        style="width: 120px; height: 120px; object-fit: cover;">
                                </div>

                                <h3 class="profile-username text-center" th:text="${user.name}">王小明</h3>
                                <p class="text-muted text-center"
                                    th:text="${user.nickName != null ? user.nickName : '尚未設定暱稱'}">小明</p>

                                <ul class="list-group list-group-unbordered mb-3">
                                    <li class="list-group-item">
                                        <b>會員 ID</b> <a class="float-right" th:text="${user.userId}">12</a>
                                    </li>
                                    <li class="list-group-item">
                                        <b>Email</b> <a class="float-right"
                                            th:text="${user.email}">user01@example.com</a>
                                    </li>
                                    <li class="list-group-item">
                                        <b>電話</b> <a class="float-right"
                                            th:text="${user.phone != null ? user.phone : 'N/A'}">0911222333</a>
                                    </li>
                                    <li class="list-group-item">
                                        <b>帳戶點數</b> <a class="float-right" th:text="${user.pointsBalance}">19</a>
                                    </li>
                                </ul>

                                <strong><i class="fas fa-book mr-1"></i> 身體數據</strong>
                                <p class="text-muted">
                                    性別: <span th:switch="${user.gender}"><span th:case="1">男</span><span
                                            th:case="2">女</span><span th:case="*">不透露</span></span><br>
                                    身高/體重: <span
                                        th:text="${user.heightCm != null ? user.heightCm + ' cm' : 'N/A'}"></span> /
                                    <span th:text="${user.weightKg != null ? user.weightKg + ' kg' : 'N/A'}"></span><br>
                                    BMI: <span th:text="${user.bmi != null ? user.bmi : 'N/A'}"></span>
                                </p>
                                <hr>
                                <strong><i class="far fa-file-alt mr-1"></i> 帳號資訊</strong>
                                <p class="text-muted">
                                    帳號狀態:
                                    <span th:if="${user.accountStatus == 1}" class="badge bg-success">啟用</span>
                                    <span th:if="${user.accountStatus == 0}" class="badge bg-danger">停權</span>
                                    <br>
                                    註冊日期: <span th:text="${#dates.format(user.createTime, 'yyyy-MM-dd')}"></span><br>
                                    最後更新: <span
                                        th:text="${user.updateTime != null ? #dates.format(user.updateTime, 'yyyy-MM-dd HH:mm') : '無'}"></span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">訂單紀錄</h3>
                            </div>
                            <div class="card-body" id="order-list-container"
                                style="max-height: 800px; overflow-y: auto;">
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <script th:src="@{/frontend-template/assets/js/jquery.min.js}"></script>
        <script th:src="@{/frontend-template/assets/js/bootstrap.min.js}"></script>
        <script th:src="@{/adminlte/js/adminlte.min.js}"></script>

        <script th:src="@{/adminlte/js/member-details.js}"></script>
</body>
</body>

</html>
