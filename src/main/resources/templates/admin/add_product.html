<head>
<title>新增商品</title>
</head>
<body>
	<div th:fragment="content">

		<!-- 頁首 -->
		<div class="app-content-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-sm-6">
						<h3 class="mb-0">新增商品</h3>
					</div>
					<div class="col-sm-6">
						<ol class="breadcrumb float-sm-end">
							<li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
							<li class="breadcrumb-item"><a th:href="@{/admin/products}">商品清單</a></li>
							<li class="breadcrumb-item active" aria-current="page">新增</li>
						</ol>
					</div>
				</div>
			</div>
		</div>

		<!-- 內容 -->
		<div class="app-content">
			<div class="container-fluid">

				<!-- 訊息區 -->
				<div class="alert alert-danger" th:if="${errorMsgs}">
					<ul class="mb-0">
						<li th:each="err : ${errorMsgs}" th:text="${err}">錯誤訊息</li>
					</ul>
				</div>
				<div class="alert alert-success" th:if="${successMsg}"
					th:text="${successMsg}">新增成功</div>

				<!-- 表單 -->
				<form th:action="@{/admin/products}" method="post"
					class="card card-primary" enctype="multipart/form-data">
					<div class="card-header">
						<h3 class="card-title">請輸入商品資料</h3>
					</div>

					<div class="card-body">
						<div class="row g-3">
							<div class="col-md-4">
								<label class="form-label">商品代碼 <span class="text-danger">*</span></label>
								<input type="text" name="productCode" class="form-control"
									th:value="${product != null ? product.productCode : ''}"
									required maxlength="64">
							</div>

							<div class="col-md-4">
								<label class="form-label">商品名稱 <span class="text-danger">*</span></label>
								<input type="text" name="productName" class="form-control"
									th:value="${product != null ? product.productName : ''}"
									required maxlength="255">
							</div>

							<div class="col-md-4">
								<label class="form-label">商品分類（type）</label> <input
									type="number" name="productType" class="form-control"
									th:value="${product != null ? product.productType : ''}"
									min="0" step="1">
							</div>

							<div class="col-md-12">
								<label class="form-label">商品描述</label>
								<textarea name="productDescription" class="form-control"
									rows="3" maxlength="255"
									th:text="${product != null ? product.productDescription : ''}"></textarea>
							</div>

							<div class="col-md-4">
								<label class="form-label">價格 <span class="text-danger">*</span></label>
								<input type="number" name="productPrice" class="form-control"
									th:value="${product != null ? product.productPrice : ''}"
									min="0" step="1" required>
							</div>

							<div class="col-md-4">
								<label class="form-label">庫存 <span class="text-danger">*</span></label>
								<input type="number" name="stockQuantity" class="form-control"
									th:value="${product != null ? product.stockQuantity : ''}"
									min="0" step="1" required>
							</div>

							<div class="col-md-4">
								<label class="form-label">狀態</label> <select
									name="productStatus" class="form-select">
									<option value="1"
										th:selected="${product != null and product.productStatus == 1}">上架</option>
									<option value="0"
										th:selected="${product == null or product.productStatus == 0}">下架</option>
								</select>
							</div>

							<!-- 圖片檔名 + 即時預覽 -->
							<div class="col-md-8">
								<label class="form-label">圖片檔名</label> <input type="text"
									name="productPicture" id="pictureInput" class="form-control"
									th:value="${product != null ? product.productPicture : ''}"
									maxlength="255" placeholder="例如：clothes.png">
								<div class="form-text">
									放置位置：
									<code>static/frontend-template/assets/img/</code>
									（只需填檔名即可）
								</div>

								<div class="mt-3">
									<label class="form-label">上傳圖片</label> <input type="file"
										name="imageFile" id="imageFile" class="form-control"
										accept="image/*"> <small class="form-text text-muted">選檔後會即時預覽並自動帶入檔名。</small>
								</div>
							</div>

							<div class="col-md-4 d-flex align-items-end">
								<img id="previewImage" class="img-fluid img-thumbnail w-100"
									alt="預覽圖片" src="/frontend-template/assets/img/default.png"
									onerror="this.src='/frontend-template/assets/img/default.png'">
							</div>
						</div>
					</div>

					<div class="card-footer d-flex gap-2">
						<button type="submit" class="btn btn-primary">新增</button>
						<a th:href="@{/admin/products}" class="btn btn-secondary">回列表</a>
						<a th:href="@{/admin/products/select}"
							class="btn btn-outline-secondary">回選擇頁</a> <a th:href="@{/}"
							class="btn btn-outline-dark">回首頁</a>
					</div>
				</form>

			</div>
		</div>

	</div>
	<script>
  document.addEventListener('DOMContentLoaded', () => {
    const file = document.getElementById('imageFile');
    const nameInput = document.getElementById('pictureInput');
    const preview = document.getElementById('previewImage');
    if (!file) return;

    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      // 即時預覽
      const url = URL.createObjectURL(f);
      if (preview) preview.src = url;
      // 自動把檔名帶回 productPicture（後端最後仍以實際儲存名為準）
      if (nameInput) nameInput.value = f.name;
    });
  });
</script>
</body>
</html>
