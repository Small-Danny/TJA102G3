<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::content}, ~{::pageScripts})}">
<head>
    <title>檢舉管理</title>
</head>
<body>
<div th:fragment="content">
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">檢舉管理</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">檢舉列表</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">所有檢舉列表</h3>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <form th:action="@{/admin/community/reports}" method="get">
                            <div class="input-group">
                                <input type="text" name="keyword" th:value="${keyword}"
                                       class="form-control" placeholder="輸入檢舉者或文章標題">
                                <button type="submit" class="btn btn-primary">搜尋</button>
                                <a th:href="@{/admin/community/reports}"
                                   class="btn btn-outline-secondary" title="重新整理">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </a>
                            </div>
                        </form>
                    </div>

                    <table class="table table-bordered table-striped">
                        <thead>
                        <tr>
                            <th>檢舉編號</th>
                            <th>檢舉者</th>
                            <th>文章標題</th>
                            <th>檢舉類型</th>
                            <th>原因</th>
                            <th>檢舉時間</th>
                            <th>處理狀態</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="report : ${reports}">
                            <td th:text="${report.reportId}"></td>
                            <td th:text="${report.name}"></td>
                            <td th:text="${report.title}"></td>
                            <td th:text="${report.reportTypeName}"></td>
                            <td th:text="${report.reason}"></td>
                            <td th:text="${report.formattedReportTime}"></td>

                            <!-- 處理狀態下拉 -->
                            <td>
                                <select th:id="'status-' + ${report.reportId}"
                                        class="form-select">
                                    <option th:each="status : ${statusList}"
                                            th:value="${status.id}"
                                            th:text="${status.statusName}"
                                            th:selected="${status.statusName} == ${report.reportStatusName}">
                                    </option>
                                </select>
                            </td>

                            <!-- 操作欄位，儲存按鈕 -->
                            <td>
                                <form th:action="@{/admin/community/reports/updateStatus}" method="post">
                                    <input type="hidden" name="reportId" th:value="${report.reportId}"/>
                                    <input type="hidden" name="statusId" th:id="'hiddenStatus-' + ${report.reportId}"/>
                                    <button type="submit"
                                            class="btn btn-success btn-sm"
                                            th:id="'saveBtn-' + ${report.reportId}"
                                            style="display:none;">
                                        儲存
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 綁定下拉選單變更事件
            document.querySelectorAll('select[id^="status-"]').forEach(function(select) {
                select.addEventListener('change', function() {
                    const reportId = this.id.split('-')[1];
                    const btn = document.getElementById('saveBtn-' + reportId);
                    const hiddenInput = document.getElementById('hiddenStatus-' + reportId);
                    if (btn && hiddenInput) {
                        hiddenInput.value = this.value; // 將選擇值同步到隱藏欄位
                        btn.style.display = 'inline-block'; // 顯示儲存按鈕
                    }
                });
            });
        });
    </script>
</div>
</body>
</html>
