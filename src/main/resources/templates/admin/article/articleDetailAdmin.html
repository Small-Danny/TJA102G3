<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::content}, ~{::pageScripts})}">
<head>
    <title>文章詳細</title>
</head>
<body>
<div th:fragment="content">
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">文章詳細</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/admin/community/posts}">文章列表</a></li>
                        <li class="breadcrumb-item active" aria-current="page">文章詳細</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">文章 ID: <span th:text="${article.articleId}"></span></h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/community/posts/{id}/update(id=${article.articleId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label>封面</label>
                            <div style="width: 200px; height: 120px; overflow: hidden;">
                                <img th:src="${article.coverImageUrl != null ? article.coverImageUrl : '/images/default-article.png'}"
                                     alt="封面" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label>標題</label>
                            <input type="text" th:value="${article.title}" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label>作者</label>
                            <input type="text" th:value="${article.name}" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label>類別</label>
                            <input type="text" th:value="${article.forumTypeName}" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label>屬性</label>
                            <select name="articleAttribute" class="form-select">
                                <option th:selected="${article.articleAttribute == '一般文章'}" value="一般文章">一般文章</option>
                                <option th:selected="${article.articleAttribute == '公告'}" value="公告">公告</option>
                                <!-- 其他屬性可自行新增 -->
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>是否置頂</label>
                            <select name="isPinned" class="form-select">
                                <option th:selected="${article.isPinned}" value="true">是</option>
                                <option th:selected="${!article.isPinned}" value="false">否</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>是否下架</label>
                            <select name="isDeleted" class="form-select">
                                <option th:selected="${article.isDeleted}" value="true">是</option>
                                <option th:selected="${!article.isDeleted}" value="false">否</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>瀏覽數</label>
                            <input type="text" th:value="${article.views}" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label>建立時間</label>
                            <input type="text" th:value="${article.createTime}" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label>文章內容</label>
                            <textarea class="form-control" rows="10" th:text="${article.content}" disabled></textarea>
                        </div>

                        <button type="submit" class="btn btn-success">更新</button>
                        <a th:href="@{/admin/community/posts}" class="btn btn-secondary">返回列表</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script th:inline="javascript">
        // 可以加一些提示訊息或確認框，例如更新成功的提醒
    </script>
</div>
</body>
</html>
