<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::content}, ~{::pageScripts})}">
<head>
    <title>文章管理</title>
</head>
<body>
<div th:fragment="content">
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">文章管理</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">文章列表</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
    <div class="app-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">所有文章列表</h3>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <form th:action="@{/admin/community/posts}" method="get">
                            <div class="input-group">
                                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="輸入標題或作者名稱">
                                <button type="submit" class="btn btn-primary">搜尋</button>
                                <a th:href="@{/admin/community/posts}" class="btn btn-outline-secondary" title="重新整理"><i class="bi bi-arrow-clockwise"></i></a>
                            </div>
                        </form>
                    </div>
                    <table class="table table-bordered table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>封面</th>
                            <th>標題</th>
                            <th>作者</th>
                            <th>類別</th>
                            <th>屬性</th>
                            <th>是否置頂</th>
                            <th>是否刪除</th>
                            <th>瀏覽數</th>
                            <th>建立時間</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="article : ${articles}">
    <td th:text="${article.articleId}"></td>
    <td>
        <div style="width: 100%; height: 60px; overflow: hidden;">
            <img th:src="${article.coverImageUrl != null ? article.coverImageUrl : '/images/default-article.png'}"
                 alt="封面"
                 style="width: 100%; height: 100%; object-fit: cover; display: block;">
        </div>
    </td>
    <td th:text="${article.title}"></td>
    <td th:text="${article.name}"></td>
    <td th:text="${article.forumTypeName}"></td>
    <td th:text="${article.articleAttribute}"></td>
    <td>
        <span th:text="${article.isPinned ? '是' : '否'}"></span>
    </td>
    <td>
        <span th:text="${article.isDeleted ? '是' : '否'}"></span>
    </td>
    <td th:text="${article.views}"></td>
    <td th:text="${article.createTime}"></td>
    <td>
        <!-- 查看按鈕 -->
        <a th:href="@{/admin/community/posts/{id}(id=${article.articleId})}" class="btn btn-info btn-sm">查看</a>

        <!-- 刪除表單 -->
        <form th:id="'deleteForm-' + ${article.articleId}" 
              th:action="@{/admin/community/posts/{id}/update(id=${article.articleId})}" 
              method="post" style="display: inline;">
            <input type="hidden" name="articleAttribute" th:value="${article.articleAttribute}" />
            <input type="hidden" name="isPinned" th:value="${article.isPinned}" />
            <input type="hidden" name="isDeleted" value="true" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
        <button th:if="${!article.isDeleted}" 
                th:onclick="confirmDelete([[${article.articleId}]], '[[${article.title}]]')" 
                type="button" class="btn btn-warning btn-sm">刪除</button>
    </td>
</tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
   <script th:inline="javascript">
    function confirmDelete(articleId, title) {
        Swal.fire({
            title: '確定要刪除嗎？',
            text: `您即將刪除文章 "${title}"`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: '是的，刪除',
            cancelButtonText: '取消'
        }).then((result) => {
            if (result.isConfirmed) {
                document.getElementById('deleteForm-' + articleId).submit();
            }
        });
    }
</script>

</div>
</body>
</html>
