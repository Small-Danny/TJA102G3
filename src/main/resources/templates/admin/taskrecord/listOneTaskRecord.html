<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
    th:replace="~{admin/layout :: layout(~{::title}, ~{::#pageContent}, ~{::#pageScripts})}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>listOneTaskRecord</title>

    <head th:insert="~{/admin/taskrecord/included-fragment}"></head>
    <style>
        :root {
            --border: #dee2e6;
            --soft: #f8f9fa;
            --nav: 72px;
        }

        body {
            padding-top: var(--nav);
        }

        [id] {
            scroll-margin-top: var(--nav);
        }

        .container-narrow {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: .5rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
        }

        .card-header {
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 1rem;
        }

        .card-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .details {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: .5rem .75rem;
            align-items: center;
        }

        @media(max-width:768px) {
            .details {
                grid-template-columns: 1fr;
            }
        }

        .label {
            font-weight: 700;
        }

        .btn {
            display: inline-block;
            padding: .375rem .75rem;
            border: 1px solid #198754;
            color: #198754;
            border-radius: .375rem;
            background: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #198754;
            color: #fff;
        }

        .btn-secondary {
            border-color: #6c757d;
            color: #6c757d;
        }

        .btn-secondary:hover {
            background: #6c757d;
            color: #fff;
        }

        .card-footer {
            padding: .75rem 1rem;
            border-top: 1px solid var(--border);
            background: var(--soft);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-success fixed-top justify-content-center">
        <div class="text-center">
            <h2 class="m-0">TaskRecord 單筆 - listOneTaskRecord</h2>
            <div class="mt-1">
                <a class="navbar-brand" th:href="@{/admin/taskrecord/select_page}"><img th:src="@{/images/back1.gif}"
                        alt="返回"> 回查詢頁</a>
            </div>
        </div>
    </nav>
    <div id="pageContent">
        <main class="container-narrow">
            <section class="card mt-3">
                <header class="card-header">
                    <h3 class="card-title">查詢結果</h3>
                    <a class="btn btn-secondary" th:href="@{/admin/taskrecord/select_page}">返回</a>
                </header>
                <div class="card-body">
                    <div class="details">
                        <div class="label">紀錄ID</div>
                        <div th:text="${taskRecordVO.taskRecordId}"></div>
                        <div class="label">任務ID</div>
                        <div th:text="${taskRecordVO.taskVO.taskId}"></div>
                        <div class="label">會員ID</div>
                        <div th:text="${taskRecordVO.user.userId}"></div>
                        <div class="label">狀態</div>
                        <div th:text="${taskRecordVO.taskRecordStatusVO.statusName}"></div>
                        <div class="label">開始時間</div>
                        <div
                            th:text="${taskRecordVO.userStartTime == null ? '-' : #temporals.format(taskRecordVO.userStartTime, 'yyyy-MM-dd HH:mm')}">
                        </div>
                        <div class="label">結束時間</div>
                        <div
                            th:text="${taskRecordVO.userEndTime == null ? '-' : #temporals.format(taskRecordVO.userEndTime, 'yyyy-MM-dd HH:mm')}">
                        </div>
                    </div>
                </div>
                <footer class="card-footer">
                    <form th:action="@{/admin/taskrecord/getOne_For_Update}" method="get" style="display:inline">
                        <input type="hidden" name="taskRecordId" th:value="${taskRecordVO.taskRecordId}" />
                        <button type="submit" class="btn">修改</button>
                    </form>
                    <form th:action="@{/admin/taskrecord/delete}" method="post"
                        style="display:inline;margin-left:.5rem">
                        <input type="hidden" name="taskRecordId" th:value="${taskRecordVO.taskRecordId}" />
                        <button type="submit" class="btn btn-secondary">刪除</button>
                    </form>
                </footer>
            </section>
        </main>
    </div>
