<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content, pageScripts)">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title th:replace="${pageTitle}">AdminLTE 4</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.3.0/styles/overlayscrollbars.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.min.css}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* 調整 Sidebar Logo 區域的左邊內距，使其與選單項目對齊 */
        .app-sidebar .brand-link {
            padding-right: 4.0em;
            /* 這個數值可以微調，直到你覺得對齊為止 */
        }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i
                                class="bi bi-list"></i></a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/admin/logout}" method="post" class="d-flex">
                            <!-- 添加CSRF Token隐藏字段 -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-link nav-link"
                                style="padding: 0.5rem 1rem; border: none; background: none;">
                                <i class="bi bi-box-arrow-right"></i> 登出
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </nav>
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand">
                <a th:href="@{/admin/dashboard}" class="brand-link">
                    <img th:src="@{/adminlte/assets/img/AdminLTELogo.png}" alt="AdminLTE Logo"
                        class="brand-image opacity-75 shadow" />
                    <span class="brand-text fw-light">後台管理</span>
                </a>
            </div>
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="navigation"
                        aria-label="Main navigation" data-accordion="false">
                        <li class="nav-item">
                            <a th:href="@{/admin/dashboard}" class="nav-link">
                                <i class="nav-icon bi bi-house-fill"></i>
                                <p>Dashboard</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/admin/members}" class="nav-link">
                                <i class="nav-icon bi bi-people-fill"></i>
                                <p>會員管理</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link">
                                <i class="nav-icon bi bi-star-fill"></i>
                                <p>目標模板<i class="nav-arrow bi bi-chevron-right"></i></p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/admin/workout-settings}" class="nav-link">
                                <i class="nav-icon bi bi-sliders"></i>
                                <p>運動設定</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link">
                                <i class="nav-icon bi bi-tags-fill"></i>
                                <p>商品管理<i class="nav-arrow bi bi-chevron-right"></i></p>
                            </a>
                            <ul class="nav nav-treeview">
                                <li class="nav-item"><a th:href="@{/admin/products}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>商品列表</p>
                                    </a></li>
                                <li class="nav-item"><a th:href="@{/admin/products/select}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>選擇商品</p>
                                    </a></li>
                                <li class="nav-item"><a th:href="@{/admin/products/add}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>新增商品</p>
                                    </a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/admin/orders}" class="nav-link">
                                <i class="nav-icon bi bi-folder-fill"></i>
                                <p>訂單管理</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link">
                                <i class="nav-icon bi bi-list-task"></i>
                                <p>社群管理<i class="nav-arrow bi bi-chevron-right"></i></p>
                            </a>
                            <ul class="nav nav-treeview">
                                <li class="nav-item"><a th:href="@{/admin/community/posts}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>文章設定</p>
                                    </a></li>
                                <li class="nav-item"><a th:href="@{/admin/community/reports}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>檢舉文章</p>
                                    </a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link">
                                <i class="nav-icon bi bi-list-check"></i>
                                <p>任務管理<i class="nav-arrow bi bi-chevron-right"></i></p>
                            </a>
                            <ul class="nav nav-treeview">
                                <li class="nav-item"><a th:href="@{/admin/taskrecord/select_page}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>任務記錄</p>
                                    </a></li>
                                <li class="nav-item"><a th:href="@{/admin/tasks/select_page}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>任務</p>
                                    </a></li>
                                <li class="nav-item"><a th:href="@{/admin/tasktype/select_page}" class="nav-link"><i
                                            class="nav-icon bi bi-circle"></i>
                                        <p>任務類型</p>
                                    </a></li>
                            </ul>
                        </li>
                        <li class="nav-header">SETTINGS</li>

                        <li class="nav-item">
                            <a th:href="@{/admin/profile}" class="nav-link">
                                <i class="nav-icon bi bi-person-circle"></i>
                                <p>個人設定</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>
        <main class="app-main">
            <div th:replace="${content}"></div>
        </main>
        <footer class="app-footer">
            <strong>Copyright &copy; 2025 <a href="#">TibaMe TJA102 G3</a>.</strong> All rights reserved.
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/adminlte/js/adminlte.min.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.3.0/browser/overlayscrollbars.browser.es6.min.js"></script>

        <th:block th:replace="${pageScripts} ?: ~{}"></th:block>


</body>

</html>
