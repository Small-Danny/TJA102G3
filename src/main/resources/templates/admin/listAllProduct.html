<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::content}, ~{::#empty-scripts})}">

<head>
  <title>所有商品</title>
</head>
<body>
<div th:fragment="content">

  <div class="app-content-header">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6">
          <h3 class="mb-0">所有商品</h3>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-end">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
            <li class="breadcrumb-item active">商品清單</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">

      <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}">操作成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}">發生錯誤</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h3 class="card-title mb-0">商品列表</h3>
          <!-- 搜尋 -->
          <form class="d-flex align-items-center gap-2" th:action="@{/admin/products}" method="get">
            <div class="input-group" style="width: 300px;">
              <input type="text" name="q" class="form-control"
                     placeholder="關鍵字（名稱/代碼）" th:value="${param.q}">
              <button type="submit" class="btn btn-primary">搜尋</button>
            </div>
            <a th:href="@{/admin/products/add}" class="btn btn-success">新增商品</a>
          </form>
        </div>

        <!-- ===== 批次操作表單（獨立，不包住表格） ===== -->
        <form th:action="@{/admin/products/bulk}" method="post" id="bulkForm" class="px-3 pt-3">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <button type="submit" name="action" value="publish"   class="btn btn-success">批次上架</button>
            <button type="submit" name="action" value="unpublish" class="btn btn-secondary">批次下架</button>
            <button type="submit" name="action" value="delete"
                    class="btn btn-danger"
                    onclick="return confirm('確定要刪除勾選的商品嗎？此動作無法復原。');">批次刪除</button>
            <span class="text-muted small ms-2">勾選後按上面按鈕即可</span>
          </div>
        </form>
        <!-- ===== 批次表單結束 ===== -->

        <div class="card-body table-responsive p-0">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th style="width:48px;"> </th>
              <th>ID</th>
              <th class="text-center">圖片</th>
              <th>名稱(代碼)</th>
              <th>價格</th>
              <th>庫存</th>
              <th>狀態</th>
              <th style="width: 280px;"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${list}">
              <!-- 指定 form="bulkForm" 讓這顆 checkbox 送到上方的批次表單 -->
              <td>
                <input type="checkbox" name="ids" th:value="${p.productId}" form="bulkForm">
              </td>

              <td th:text="${p.productId}">1</td>

              <!-- 圖片欄 -->
              <td class="text-center">
                <img th:if="${p.productPicture != null}"
                     th:src="@{/frontend-template/assets/img/{file}(file=${p.productPicture})}"
                     alt="商品圖片" class="rounded shadow-sm"
                     style="width: 150px; height: 150px; object-fit: cover;">
                <img th:if="${p.productPicture == null}"
                     th:src="@{/frontend-template/assets/img/default.png}"
                     alt="商品圖片" class="rounded shadow-sm"
                     style="width: 150px; height: 150px; object-fit: cover;">
              </td>

              <td class="align-middle ps-3">
                <div class="fw-semibold" th:text="${p.productName}">名稱</div>
                <div class="text-muted small" th:text="${p.productCode}">P-001</div>
              </td>

              <td>
                NT$<span th:text="${#numbers.formatDecimal(p.productPrice, 1, 'COMMA', 0, 'POINT')}">0</span>
              </td>

              <td>
                <span th:text="${p.stockQuantity}">0</span> 件
              </td>

              <!-- 狀態徽章 -->
              <td>
                <span th:if="${p.productStatus == 1}" class="badge bg-success">上架</span>
                <span th:if="${p.productStatus != 1}" class="badge bg-secondary">下架</span>
              </td>

              <!-- 單筆操作（獨立的小表單，與批次表單不再互相巢狀） -->
              <td>
                <div class="d-flex flex-wrap gap-2">
                  <a class="btn btn-sm btn-outline-primary"
                     th:href="@{/admin/products/{id}(id=${p.productId})}">查看</a>

                  <a class="btn btn-sm btn-warning"
                     th:href="@{/admin/products/{id}/edit(id=${p.productId})}">編輯</a>

                  <form th:action="@{/admin/products/{id}/status(id=${p.productId})}"
                        method="post" class="d-inline"
                        th:onsubmit="'return confirm(\'確定要' + (${p.productStatus == 1} ? '下架' : '上架') + '嗎？\');'">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="status" th:value="${p.productStatus == 1 ? 0 : 1}"/>
                    <button type="submit"
                            th:class="'btn btn-sm ' + (${p.productStatus == 1} ? 'btn-secondary' : 'btn-success')"
                            th:text="${p.productStatus == 1 ? '下架' : '上架'}">
                      下架
                    </button>
                  </form>

                  <form th:action="@{/admin/products/{id}/delete(id=${p.productId})}"
                        method="post" class="d-inline"
                        onsubmit="return confirm('確定要刪除嗎？');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger">刪除</button>
                  </form>
                </div>
              </td>
            </tr>

            <tr th:if="${list == null or #lists.isEmpty(list)}">
              <td colspan="8" class="text-center text-muted py-4">目前查不到商品資料。</td>
            </tr>
            </tbody>
          </table>
        </div>

        <div class="card-footer d-flex gap-2">
          <a th:href="@{/admin/products/select}" class="btn btn-secondary">回選擇頁</a>
        </div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
