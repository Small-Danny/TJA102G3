<!doctype html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>後台管理系統 - 登入</title>
    <!-- 引入AdminLTE樣式 -->
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.min.css}">
    <!-- 引入Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- 引入Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        /* 頁面整體樣式 */
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .login-header {
            background-color: #007bff;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        .card-body {
            padding: 2rem;
        }

        .login-box-msg {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            color: #495057;
        }

        /* 密碼切換按鈕樣式 */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            background: transparent;
            border: none;
            width: 40px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #343a40;
        }

        .password-wrapper .form-control {
            padding-right: 80px !important;
        }

        /* 驗證碼樣式 */
        .g-recaptcha {
            display: flex;
            justify-content: center;
            margin: 0 auto 1rem;
            padding: 10px 0;
        }

        /* 記住我樣式 */
        .remember-me-container {
            margin-bottom: 1rem;
        }

        /* 錯誤提示樣式 */
        .error-message {
            color: #dc3545;
            margin-top: 0.5rem;
            text-align: center;
        }

        /* 按鈕樣式增強 */
        .btn-login {
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <!-- 頁頭 -->
        <div class="login-header">
            <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>後台管理系統</h4>
        </div>

        <!-- 卡片內容 -->
        <div class="card-body">
            <p class="login-box-msg">請輸入帳號密碼進行登入</p>

            <!-- 提示訊息 -->
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i>帳號或密碼錯誤，請重新輸入
            </div>
            <div th:if="${param.recaptchaError}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i>驗證碼驗證失敗，請重新嘗試
            </div>
            <div th:if="${param.logout}" class="alert alert-info" role="alert">
                <i class="bi bi-info-circle me-1"></i>您已成功登出系統
            </div>
            <div th:if="${param.sessionExpired}" class="alert alert-warning" role="alert">
                <i class="bi bi-clock-history me-1"></i>會話已過期，請重新登入
            </div>

            <!-- 登入表單 -->
            <form th:action="@{/admin/login}" method="post">
                <!-- CSRF令牌 (Spring Security必要) -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- 帳號輸入框 -->
                <div class="input-group mb-3">
                    <input type="text" 
                           class="form-control" 
                           placeholder="請輸入用戶名" 
                           name="username" 
                           required
                           th:value="${param.username}"
                           autofocus>
                    <div class="input-group-text">
                        <span class="bi bi-person-fill"></span>
                    </div>
                </div>

                <!-- 密碼輸入框 -->
                <div class="input-group mb-3 password-wrapper">
                    <input type="password" class="form-control" 
                           placeholder="請輸入密碼" 
                           name="password" 
                           id="password" 
                           required>
                    <div class="input-group-text">
                        <span class="bi bi-lock-fill"></span>
                    </div>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>

                <!-- 驗證碼 -->
                <div class="input-group mb-3">
                    <div class="g-recaptcha" data-sitekey="6Lf1ZMkrAAAAAM9cTH1MFDhcmSsHq7jd6IZOxyAw"></div>
                </div>

                <!-- 記住我 -->
                <div class="row remember-me-container">
                    <div class="col-8">
                        <div class="icheck-primary">
                            <input type="checkbox" id="remember" name="remember-me" checked>
                            <label for="remember">
                                記住我 (14天內免登入)
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 登入按鈕 -->
                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100 btn-login">
                            <i class="bi bi-box-arrow-in-right me-1"></i> 登入系統
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 引入JavaScript -->
    <script th:src="@{/adminlte/js/adminlte.js}"></script>
    <script>
        // 密碼可見性切換功能
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // 切換圖標
                    const icon = toggleBtn.querySelector('i');
                    icon.classList.toggle('bi-eye');
                    icon.classList.toggle('bi-eye-slash');
                });
            }

            // 自動聚焦到第一個錯誤提示
            const alertElement = document.querySelector('.alert-danger');
            if (alertElement) {
                alertElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    </script>
</body>
</html>
