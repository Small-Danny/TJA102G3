<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>所有類別資料 - listAllTaskType (Simple0)</title>

    <script th:src="@{/js/jquery-1.11.3.min.js}"></script>

    <head th:insert="~{/admin/tasktype/included-fragment}"></head>
    <style>
        :root {
            --card-bg: #fff;
            --card-border: #dee2e6;
            --muted: #6c757d;
        }

        body {
            padding-top: 72px;
        }

        .container-narrow {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: .5rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
        }

        .card-header {
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-body {
            padding: 1rem;
        }

        .card-footer {
            padding: .75rem 1rem;
            border-top: 1px solid var(--card-border);
            background: #f8f9fa;
        }

        .btn {
            display: inline-block;
            padding: .375rem .75rem;
            border: 1px solid #198754;
            color: #198754;
            background: #fff;
            border-radius: .375rem;
            text-decoration: none;
            font-size: .9rem;
            cursor: pointer;
        }

        .btn:hover {
            background: #198754;
            color: #fff;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        .table thead th {
            background: #f3f6f9;
            font-weight: 600;
        }

        .table th,
        .table td {
            border: 1px solid #e9ecef;
            padding: .5rem .5rem;
            text-align: center;
            vertical-align: middle;
        }

        .pagination {
            display: flex;
            gap: .25rem;
            margin: 0;
            list-style: none;
            padding: 0;
        }

        .pagination .page-item .page-link {
            display: block;
            padding: .25rem .5rem;
            border: 1px solid #dee2e6;
            border-radius: .375rem;
            text-decoration: none;
            color: #0d6efd;
        }

        .pagination .page-item.active .page-link {
            background: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }

        .pagination .page-item.disabled .page-link {
            color: var(--muted);
            pointer-events: none;
            background: #f8f9fa;
        }

        .subhead {
            color: var(--muted);
            font-size: .9rem;
        }
    </style>
    <script>
        $(function () {
            var $table = $("#ttTable"), currentPage = 0, pageSize = 8;
            function renderPage() {
                var $rows = $table.find('tbody tr');
                $rows.hide().slice(currentPage * pageSize, (currentPage + 1) * pageSize).show();
                $('#currentPage').text(currentPage + 1);
            }
            var sumRows = $("#ttTable tbody tr").length;
            var sumPages = Math.max(1, Math.ceil(sumRows / pageSize));
            $('#pageNumber').text(sumPages);
            var $pager = $("#pager");
            function buildPager() {
                $pager.empty();
                $('<li class="page-item"><a class="page-link" href="#">&laquo;</a></li>')
                    .toggleClass('disabled', currentPage === 0)
                    .on('click', function (e) { e.preventDefault(); if (currentPage > 0) { currentPage--; update(); } })
                    .appendTo($pager);
                for (let i = 0; i < sumPages; i++) {
                    (function (p) {
                        var $li = $('<li class="page-item"><a class="page-link" href="#">' + (p + 1) + '</a></li>');
                        if (p === currentPage) $li.addClass('active');
                        $li.on('click', function (e) { e.preventDefault(); currentPage = p; update(); });
                        $li.appendTo($pager);
                    })(i);
                }
                $('<li class="page-item"><a class="page-link" href="#">&raquo;</a></li>')
                    .toggleClass('disabled', currentPage >= sumPages - 1)
                    .on('click', function (e) { e.preventDefault(); if (currentPage < sumPages - 1) { currentPage++; update(); } })
                    .appendTo($pager);
            }
            function update() { renderPage(); buildPager(); }
            update();
        });
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-success fixed-top justify-content-center">
        <div class="text-center">
            <h2 class="m-0">所有類別資料 - listAllTaskType</h2>
            <div class="mt-1">
                <a class="navbar-brand" th:href="@{/tasktype/select_page}">
                    <img th:src="@{/images/back1.gif}" alt="返回"> 回查詢頁
                    <label th:text="${success}"></label>
                </a>
            </div>
        </div>
    </nav>

    <main class="container-narrow">
        <div class="subhead my-3 text-center">
            <b>第 <span id="currentPage">1</span>/<span id="pageNumber"></span> 頁</b>
            <span class="mx-2">•</span>
            <b>符合條件共 <span class="text-danger" th:text="${list.size()}"></span> 筆</b>
        </div>

        <section class="card mb-4">
            <header class="card-header">
                <h3 class="card-title">類別列表</h3>
                <div>
                    <a class="btn" th:href="@{/tasktype/add}">新增類別</a>
                </div>
            </header>

            <div class="card-body">
                <div class="table-responsive">
                    <table id="ttTable" class="table table-bordered align-middle">
                        <thead>
                            <tr>
                                <th style="width:60px">#</th>
                                <th style="width:120px">類別ID</th>
                                <th>類別名稱</th>
                                <th style="width:100px">修改</th>
                                <th style="width:100px">刪除</th>
                            </tr>
                        </thead>
                        <tbody>
                            <th:block th:each="tt, st : ${list}">
                                <tr>
                                    <td th:text="${st.count}"></td>
                                    <td th:text="${tt.taskTypeId}"></td>
                                    <td th:text="${tt.taskTypeName}"></td>
                                    <td>
                                        <form method="get" th:action="@{/tasktype/getOne_For_Update}" style="margin:0">
                                            <input type="hidden" name="taskTypeId" th:value="${tt.taskTypeId}" />
                                            <input type="submit" class="btn" value="修改" />
                                        </form>
                                    </td>
                                    <td>
                                        <form method="post" th:action="@{/tasktype/delete}" style="margin:0">
                                            <input type="hidden" name="taskTypeId" th:value="${tt.taskTypeId}" />
                                            <input type="submit" class="btn" value="刪除" />
                                        </form>
                                    </td>
                                </tr>
                            </th:block>
                        </tbody>
                    </table>
                </div>
            </div>

            <footer class="card-footer clearfix">
                <ul id="pager" class="pagination pagination-sm m-0" style="justify-content:flex-end"></ul>
            </footer>
        </section>
    </main>
</body>

</html>
