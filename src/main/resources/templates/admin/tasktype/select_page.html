<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>類別資料管理 - select_page (Simple0)</title>

    <head th:insert="~{/admin/tasktype/included-fragment}"></head>
    <style>
        :root {
            --card-bg: #fff;
            --card-border: #dee2e6;
            --muted: #6c757d;
            --soft: #f8f9fa;
        }

        body {
            padding-top: 72px;
        }

        .container-wide {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: .5rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
        }

        .card-header {
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-body {
            padding: 1rem;
        }

        .card-footer {
            padding: .75rem 1rem;
            border-top: 1px solid var(--card-border);
            background: var(--soft);
        }

        .grid-main {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 1rem;
        }

        @media(max-width:992px) {
            .grid-main {
                grid-template-columns: 1fr;
            }
        }

        .form-grid {
            display: grid;
            grid-template-columns: 150px 1fr auto;
            gap: .5rem .75rem;
            align-items: center;
        }

        .form-grid.noselect {
            grid-template-columns: 150px 220px auto;
        }

        @media(max-width:768px) {

            .form-grid,
            .form-grid.noselect {
                grid-template-columns: 1fr;
            }
        }

        .form-grid label {
            font-weight: 600;
        }

        .form-grid input[type=text],
        .form-grid select {
            width: 100%;
            padding: .375rem .5rem;
            border: 1px solid #e9ecef;
            border-radius: .375rem;
        }

        .btn {
            display: inline-block;
            padding: .375rem .75rem;
            border: 1px solid #198754;
            color: #198754;
            background: #fff;
            border-radius: .375rem;
            text-decoration: none;
            font-size: .9rem;
            cursor: pointer;
        }

        .btn:hover {
            background: #198754;
            color: #fff;
        }

        .btn-secondary {
            border-color: #6c757d;
            color: #6c757d;
        }

        .btn-secondary:hover {
            background: #6c757d;
            color: #fff;
        }

        .hint {
            color: var(--muted);
            font-size: .9rem;
        }

        .errorblock {
            color: #dc3545;
            margin: .25rem 0 .75rem;
        }

        .list-links {
            list-style: none;
            padding-left: 1rem;
            margin: 0;
        }

        .list-links li {
            margin: .25rem 0;
        }

        .divider-soft {
            height: 1px;
            background: #eef1f4;
            margin: .5rem 0 1rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-success fixed-top justify-content-center">
        <div class="text-center">
            <h2 class="m-0">類別資料管理 - select_page</h2>
            <div class="mt-1">
                <a class="navbar-brand" th:href="@{/}"><img th:src="@{/images/back1.gif}" alt="返回">回 index</a>
            </div>
        </div>
    </nav>

    <main class="container-wide">
        <div class="grid-main mt-3">
            <!-- 左：查詢/導航 -->
            <section class="card">
                <header class="card-header">
                    <h3 class="card-title">資料查詢</h3>
                    <a class="btn btn-secondary" th:href="@{/tasktype/add}">新增類別</a>
                </header>
                <div class="card-body">
                    <div class="errorblock" th:utext="${errorMessage}"></div>

                    <ul class="list-links">
                        <li>
                            <a class="btn" th:href="@{/tasktype/listAll}">瀏覽所有類別</a>
                            <span class="hint">（List all TaskTypes）</span>
                        </li>
                    </ul>

                    <div class="divider-soft"></div>

                    <!-- 以ID（輸入）查單筆 -->
                    <form class="form-grid noselect" method="get" th:action="@{/tasktype/getOne}">
                        <label>輸入類別ID</label>
                        <input type="text" name="taskTypeId" th:value="${param.taskTypeId}" placeholder="例如：10" />
                        <button type="submit" class="btn">送出</button>
                    </form>

                    <!-- 以ID（下拉）查單筆 -->
                    <form class="form-grid mt-3" method="get" th:action="@{/tasktype/getOne}">
                        <label>選擇類別ID</label>
                        <select name="taskTypeId">
                            <option th:each="tt : ${taskTypeListData}" th:value="${tt.taskTypeId}"
                                th:text="${tt.taskTypeId}"></option>
                        </select>
                        <button type="submit" class="btn">送出</button>
                    </form>

                    <!-- 以名稱（下拉）查單筆 -->
                    <form class="form-grid mt-3" method="get" th:action="@{/tasktype/getOne}">
                        <label>選擇類別名稱</label>
                        <select name="taskTypeId">
                            <option th:each="tt : ${taskTypeListData}" th:value="${tt.taskTypeId}"
                                th:text="${tt.taskTypeName}"></option>
                        </select>
                        <button type="submit" class="btn">送出</button>
                    </form>
                </div>
                <footer class="card-footer">
                    <span class="hint">提示：此頁提供三種查詢方式，並可直接前往「新增類別」或「瀏覽全部」。</span>
                </footer>
            </section>

            <!-- 右：單筆預覽（片段） -->
            <aside class="card" th:if="${taskTypeVO != null}">
                <header class="card-header">
                    <h3 class="card-title">單筆類別預覽</h3>
                    <a class="btn btn-secondary" th:href="@{/tasktype/select_page}">清除預覽</a>
                </header>
                <div class="card-body">
                    <div th:insert="~{/back-end/tasktype/listOneTaskType :: listOneTaskType-div}"></div>
                </div>
            </aside>
        </div>
    </main>
</body>

</html>
