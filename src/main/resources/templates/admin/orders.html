<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<title>訂單管理</title>

<!-- CSRF（CookieCsrfTokenRepository 對應） -->
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<!-- Bootstrap 5 -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
.content-wrapper {
	margin: 20px;
}

.toolbar {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 15px;
}

.search-box {
	display: flex;
	gap: 8px;
}

.search-box input {
	padding: 6px 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	width: 250px;
}

/* 分頁 */
.pagination {
	display: flex;
	justify-content: center;
	list-style: none;
	padding: 0;
	margin-top: 15px;
}

.pagination li {
	margin: 0 5px;
}

.pagination button {
	border: 1px solid #ccc;
	background: #fff;
	padding: 5px 10px;
	cursor: pointer;
	border-radius: 4px;
}

.pagination button.active {
	background: #0d6efd;
	color: #fff;
	border-color: #0d6efd;
}

.pagination button:disabled {
	background: #eee;
	cursor: not-allowed;
}

.status-col {
	width: 140px;
}

.status-select {
	width: 120px;
	display: inline-block;
	padding: .25rem .5rem;
	font-size: .9rem;
	height: calc(1.5em + .5rem);
}

.amount-col {
	white-space: nowrap;
}

.action-col {
	width: 210px;
	white-space: nowrap;
} /* 防掉行 */

/* 作法 A：同一個 td 內用 inline-flex 保證兩顆按鈕同列不換行 */
.actions {
	display: inline-flex;
	align-items: center;
	gap: .5rem;
	flex-wrap: nowrap;
}

/* 尚未儲存的列背景提示 */
tr.dirty-row {
	background: #fff7e6;
}
</style>
</head>
<body>
	<div
		th:replace="~{admin/layout :: layout(~{::title}, ~{::section}, ~{::#pageScripts})}">
		<title>訂單管理</title>

		<section class="content-wrapper">
			<div class="card">
				<div class="card-header">
					<h3 class="card-title">訂單管理</h3>
				</div>

				<div class="card-body">
					<!-- 工具列：搜尋 + 匯出 -->
					<div class="toolbar">
						<div class="search-box">
							<input type="text" id="searchInput" placeholder="輸入關鍵字搜尋...">
							<button class="btn btn-primary" id="searchBtn">搜尋</button>
						</div>
						<button class="btn btn-success" id="exportBtn">Export</button>
					</div>

					<!-- 訂單表格 -->
					<table id="orderTable"
						class="table table-bordered table-striped align-middle">
						<thead>
							<tr>
								<th>訂單編號</th>
								<th>成立日期</th>
								<th>會員ID</th>
								<th>收件人</th>
								<th>付款狀態</th>
								<th class="status-col">出貨狀態</th>
								<th class="amount-col">總金額</th>
								<th class="action-col">操作</th>
							</tr>
						</thead>
						<tbody>
							<!-- 以 Thymeleaf 渲染每筆訂單 -->
							<tr th:each="order : ${orders}">
								<td th:text="${order.orderId}"></td>
								<td
									th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
								<td th:text="${order.userId}"></td>
								<td th:text="${order.recipientName}"></td>

								<td><span th:attr="data-payment=${order.paymentStatus}"
									th:text="${order.paymentStatus == 1 ? '已付款' : '未付款'}"
									th:classappend="${order.paymentStatus == 1} ? 'badge bg-success' : 'badge bg-secondary'"></span>
								</td>

								<!-- 出貨狀態 -->
								<td class="status-col"><select
									class="form-select form-select-sm status-select"
									th:attr="data-order-id=${order.orderId}"
									th:value="${order.orderStatus}">
										<option value="0" th:selected="${order.orderStatus == 0}">待出貨</option>
										<option value="1" th:selected="${order.orderStatus == 1}">處理中</option>
										<option value="2" th:selected="${order.orderStatus == 2}">已出貨</option>
										<option value="3" th:selected="${order.orderStatus == 3}">已完成</option>
										<option value="4" th:selected="${order.orderStatus == 4}">取消</option>
								</select></td>

								<td class="amount-col" th:text="|$${order.totalPrice}|"></td>

								<!-- 作法 A：按鈕塞同一個 flex 容器，保證同列 -->
								<td class="action-col">
									<div class="actions">
										<button type="button"
											class="btn btn-sm btn-outline-secondary js-show-items"
											th:attr="data-order-id=${order.orderId}">商品明細</button>
										<button type="button"
											class="btn btn-sm btn-outline-primary save-status-btn"
											th:attr="data-order-id=${order.orderId}">儲存</button>
									</div>
								</td>
							</tr>
						</tbody>
					</table>

					<!-- 分頁 -->
					<ul id="pagination" class="pagination"></ul>
				</div>
			</div>
		</section>
	</div>

	<!-- 商品明細 Modal -->
	<div class="modal fade" id="orderItemsModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">
						訂單 <span class="js-order-id"></span> 的商品明細
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="關閉"></button>
				</div>
				<div class="modal-body">
					<div class="table-responsive">
						<table class="table table-sm align-middle">
							<thead>
								<tr>
									<th>商品</th>
									<th class="text-end">數量</th>
									<th class="text-end">單價</th>
									<th class="text-end">小計</th>
								</tr>
							</thead>
							<tbody></tbody>
							<tfoot>
								<tr>
									<th colspan="3" class="text-end">合計</th>
									<th class="text-end js-subtotal">$0</th>
								</tr>
							</tfoot>
						</table>
					</div>
				</div>
				<div class="modal-footer">
					<button class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 頁面腳本 -->
	<script>
    /* ====== 分頁 / 搜尋（支援數字搜尋金額與訂單編號） ====== */
    const rowsPerPage = 10;
    let currentPage = 1;

    function renderTable() {
      const filterRaw = document.getElementById("searchInput").value.trim();
      const filter = filterRaw.toLowerCase();
      const rows = document.querySelectorAll("#orderTable tbody tr");

      const filteredRows = Array.from(rows).filter(row => {
        if (filter === "") return true;

        // 全列文字
        const fullText = row.innerText.toLowerCase();

        // 供數字搜尋金額：移除 $ 與 , 與多餘空白
        const normalizedText = fullText
          .replace(/\$/g, '')
          .replace(/,/g, '')
          .replace(/\s+/g, ' ');

        // 第一欄：訂單編號（精準比對）
        const orderIdText = (row.querySelector("td:nth-child(1)")?.innerText || '')
          .trim()
          .toLowerCase();

        // 如果輸入的是數字字串：允許「訂單編號精準」或「任何欄位包含該數字（去格式後）」
        if (!isNaN(filter) && filter !== "") {
          return orderIdText === filter || normalizedText.includes(filter);
        }
        // 一般文字搜尋
        return normalizedText.includes(filter);
      });

      const totalPages = Math.ceil(filteredRows.length / rowsPerPage);
      if (currentPage > totalPages) currentPage = totalPages || 1;

      rows.forEach(r => r.style.display = "none");
      filteredRows.forEach((row, i) => {
        if (i >= (currentPage - 1) * rowsPerPage && i < currentPage * rowsPerPage) {
          row.style.display = "";
        }
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";
      if (totalPages <= 1) return;

      const addBtn = (label, disabled, onClick, active=false) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.innerText = label;
        btn.disabled = disabled;
        if (active) btn.classList.add("active");
        btn.addEventListener("click", onClick);
        li.appendChild(btn);
        pagination.appendChild(li);
      };

      addBtn("«", currentPage === 1, () => { if (currentPage>1){ currentPage--; renderTable(); } });
      for (let i=1;i<=totalPages;i++) {
        addBtn(String(i), false, () => { currentPage = i; renderTable(); }, i===currentPage);
      }
      addBtn("»", currentPage === totalPages, () => { if (currentPage<totalPages){ currentPage++; renderTable(); } });
    }

    document.getElementById("exportBtn").addEventListener("click", function () {
      const rows = document.querySelectorAll("#orderTable tbody tr");
      const csv = [];
      rows.forEach(row => {
        if (row.style.display !== "none") {
          const cols = row.querySelectorAll("td, th");
          const rowData = [];
          cols.forEach(col => rowData.push('"' + col.innerText.trim().replaceAll('"','""') + '"'));
          csv.push(rowData.join(","));
        }
      });
      const blob = new Blob(["\ufeff" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "orders_page_" + currentPage + ".csv";
      a.click(); URL.revokeObjectURL(url);
    });

    document.getElementById("searchBtn").addEventListener("click", () => { currentPage = 1; renderTable(); });
    document.getElementById("searchInput").addEventListener("keypress", e => {
      if (e.key === "Enter") { currentPage = 1; renderTable(); }
    });

    /* ====== 出貨狀態：變更標記 + 儲存 ====== */
    const CSRF_TOKEN  = document.querySelector('meta[name="_csrf"]')?.content;
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]')?.content;

    function bindDirtyMarker() {
      document.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', e => {
          e.target.closest('tr')?.classList.add('dirty-row');
        });
      });
    }

    function bindSaveButtons() {
      document.querySelectorAll('.save-status-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const row = e.target.closest('tr');
          const selectEl = row.querySelector('.status-select');
          const orderId  = selectEl.dataset.orderId;
          const newVal   = parseInt(selectEl.value, 10);
          if (!row.classList.contains('dirty-row')) return;

          const headers = { 'Content-Type': 'application/json' };
          if (CSRF_TOKEN && CSRF_HEADER) headers[CSRF_HEADER] = CSRF_TOKEN;

          btn.disabled = true;
          selectEl.disabled = true;
          try {
            const resp = await fetch(`/api/admin/orders/${orderId}/status`, {
              method: 'PUT',
              headers,
              body: JSON.stringify({ orderStatus: newVal })
            });
            if (!resp.ok) throw new Error(`更新失敗 (${resp.status})`);

            row.classList.remove('dirty-row');
            btn.classList.remove('btn-outline-primary');
            btn.classList.add('btn-success');
            btn.textContent = '已儲存';
            setTimeout(() => {
              btn.classList.remove('btn-success');
              btn.classList.add('btn-outline-primary');
              btn.textContent = '儲存';
            }, 1200);
          } catch (err) {
            alert(err.message || '儲存失敗，請稍後再試');
          } finally {
            btn.disabled = false;
            selectEl.disabled = false;
          }
        });
      });
    }

    /* ====== 商品明細：讀取並顯示（計算合計正確） ====== */
    const orderItemsCache = new Map();

    document.body.addEventListener('click', async (evt) => {
      const btn = evt.target.closest('.js-show-items');
      if (!btn) return;

      const orderId = btn.dataset.orderId;
      try {
        const items = await getOrderItems(orderId);
        openItemsModal(orderId, items);
      } catch (err) {
        console.error(err);
        alert('讀取商品明細失敗，請稍後再試');
      }
    });

    async function getOrderItems(orderId) {
      if (orderItemsCache.has(orderId)) return orderItemsCache.get(orderId);
      const res = await fetch(`/api/admin/orders/${orderId}/items`, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      orderItemsCache.set(orderId, data);
      return data;
    }

    function openItemsModal(orderId, items) {
      const modalEl = document.getElementById('orderItemsModal');
      if (!modalEl) return;

      modalEl.querySelector('.js-order-id').textContent = orderId;
      const tbody = modalEl.querySelector('tbody');

      const html = (items || []).map(it => {
        const name  = escapeHtml(it.productName || it.product?.productName || it.product?.name || '');
        const qty   = Number(it.orderItemQuantity ?? it.quantity ?? 0);
        // 以後端實際欄位為準，優先取 buyPrice；無則 fallback
        const price = Number(it.buyPrice ?? it.unitPrice ?? it.price ?? 0);
        const sub   = qty * price;
        return `
          <tr>
            <td>${name}</td>
            <td class="text-end">${fmt(qty)}</td>
            <td class="text-end">$${fmt(price)}</td>
            <td class="text-end">$${fmt(sub)}</td>
          </tr>
        `;
      }).join('');

      tbody.innerHTML = html || `<tr><td colspan="4" class="text-center text-muted">沒有商品</td></tr>`;

      const total = (items || []).reduce((s, it) => {
        const qty   = Number(it.orderItemQuantity ?? it.quantity ?? 0);
        const price = Number(it.buyPrice ?? it.unitPrice ?? it.price ?? 0);
        return s + qty * price;
      }, 0);
      modalEl.querySelector('.js-subtotal').textContent = '$' + fmt(total);

      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }

    /* ====== 小工具 ====== */
    function fmt(n) { return (Math.round(Number(n || 0) * 100) / 100).toLocaleString(); }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    /* ====== 初始綁定 ====== */
    document.addEventListener('DOMContentLoaded', () => {
      renderTable();           // 初次渲染與分頁
      bindDirtyMarker();       // 監聽 select 變更
      bindSaveButtons();       // 綁定儲存
    });
  </script>
</body>
</html>
