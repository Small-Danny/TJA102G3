<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台登入</title>
<link rel="stylesheet" th:href="@{/adminlte/css/adminlte.min.css}">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
/* 密碼切換按鈕樣式 - 解決重疊問題 */
.password-wrapper {
    position: relative;
}

.toggle-password {
    position: absolute;
    right: 40px; /* 避開左側密碼鎖圖標 */
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #6c757d; /* 與輸入框圖標顏色協調 */
    background: transparent;
    border: none;
    width: 40px; /* 固定寬度避免點擊區域過大 */
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toggle-password:hover {
    color: #343a40; /* 懸停時加深顏色 */
}

/* 調整密碼輸入框右邊距，避免文字被按鈕遮擋 */
.password-wrapper .form-control {
    padding-right: 80px !important;
}

/* reCAPTCHA 居中顯示 */
.g-recaptcha {
    display: flex;
    justify-content: center;
    margin: 0 auto;
    padding: 10px 0;
}

/* 增加記住我選項與登錄按鈕之間的距離 */
.remember-me-container {
    margin-bottom: 1rem; /* 增加底部間距 */
}
</style>
</head>
<body class="login-page bg-body-secondary">

	<div class="login-box">
		<div class="card card-outline card-primary">
			<div class="card-header text-center">
				<a href="#" class="h1"><b>後台管理</b></a>
			</div>
			<div class="card-body">
				<p class="login-box-msg">請登入以開始</p>

				<!-- 錯誤提示 -->
				<div th:if="${param.error}" class="alert alert-danger" role="alert">
					帳號或密碼錯誤</div>

				<!-- 登出提示 -->
				<div th:if="${param.logout}" class="alert alert-success"
					role="alert">您已成功登出</div>

				<form th:action="@{/admin/login}" method="post">
					<!-- 用戶名輸入框 -->
					<div class="input-group mb-3">
						<input type="text" class="form-control" placeholder="Username"
							name="username" required>
						<div class="input-group-text">
							<span class="bi bi-person-fill"></span>
						</div>
					</div>
					
					<!-- 密碼輸入框（帶可見性切換） -->
					<div class="input-group mb-3 password-wrapper">
						<input type="password" class="form-control" placeholder="Password"
							name="password" id="password" required>
						<div class="input-group-text">
							<span class="bi bi-lock-fill"></span>
						</div>
						<!-- 密碼可見性切換按鈕 -->
						<button type="button" class="toggle-password" id="togglePassword">
							<i class="bi bi-eye-slash"></i>
						</button>
					</div>
					
					<!-- 驗證碼 -->
					<div class="input-group mb-3">
						<div class="g-recaptcha" 
						     data-sitekey="6Lf1ZMkrAAAAAM9cTH1MFDhcmSsHq7jd6IZOxyAw">
						</div>
					</div>
					
					<!-- 記住我 - 添加了額外的樣式類來增加間距 -->
					<div class="row remember-me-container">
						<div class="col-8">
							<div class="icheck-primary">
								<input type="checkbox" id="remember" name="remember-me">
								<label for="remember">記住我</label>
							</div>
						</div>
					</div>
					
					<!-- 登入按鈕 -->
					<div class="row">
						<div class="col-12">
							<button type="submit" class="btn btn-primary w-100">登入</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script th:src="@{/adminlte/js/adminlte.js}"></script>
	<script>
		// 密碼可見性切換邏輯
		document.addEventListener('DOMContentLoaded', function() {
			const toggleBtn = document.getElementById('togglePassword');
			const passwordInput = document.getElementById('password');
			
			toggleBtn.addEventListener('click', function() {
				// 切換密碼輸入框的類型
				const type = passwordInput.getAttribute('type') === 'password' 
					? 'text' 
					: 'password';
				passwordInput.setAttribute('type', type);
				
				// 切換按鈕圖標
				const icon = toggleBtn.querySelector('i');
				if (type === 'password') {
					icon.classList.remove('bi-eye');
					icon.classList.add('bi-eye-slash');
				} else {
					icon.classList.remove('bi-eye-slash');
					icon.classList.add('bi-eye');
				}
			});
		});
	</script>
</body>
</html>
