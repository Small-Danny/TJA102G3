<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout :: layout(~{::title}, ~{::content}, ~{::#empty-scripts})}">
<head>
<title>編輯商品</title>
</head>
<body>
	<div th:fragment="content">

		<!-- 頁首 -->
		<div class="app-content-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-sm-6">
						<h3 class="mb-0">編輯商品</h3>
					</div>
					<div class="col-sm-6">
						<ol class="breadcrumb float-sm-end">
							<li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
							<li class="breadcrumb-item"><a th:href="@{/admin/products}">商品清單</a></li>
							<li class="breadcrumb-item active" aria-current="page">編輯</li>
						</ol>
					</div>
				</div>
			</div>
		</div>

		<!-- 內容 -->
		<div class="app-content">
			<div class="container-fluid">

				<!-- 訊息 -->
				<div class="alert alert-danger" th:if="${errorMsgs}">
					<ul class="mb-0">
						<li th:each="err : ${errorMsgs}" th:text="${err}">錯誤訊息</li>
					</ul>
				</div>
				<div class="alert alert-success" th:if="${successMsg}"
					th:text="${successMsg}">更新成功</div>

				<!-- 表單 -->
				<form
					th:action="@{/admin/products/{id}/edit(id=${product.productId})}"
					method="post" enctype="multipart/form-data"
					class="card card-primary">

					<div class="card-header">
						<h3 class="card-title">修改商品資料</h3>
					</div>

					<div class="card-body">
						<div class="row g-3">

							<input type="hidden" name="productId"
								th:value="${product.productId}" />

							<div class="col-md-4">
								<label class="form-label">商品代碼 <span class="text-danger">*</span></label>
								<input type="text" name="productCode" class="form-control"
									th:value="${product.productCode}" required maxlength="64">
							</div>

							<div class="col-md-4">
								<label class="form-label">商品名稱 <span class="text-danger">*</span></label>
								<input type="text" name="productName" class="form-control"
									th:value="${product.productName}" required maxlength="255">
							</div>

							<div class="col-md-4">
								<label class="form-label">商品分類（type）</label> <input
									type="number" name="productType" class="form-control"
									th:value="${product.productType}" min="0" step="1">
							</div>

							<div class="col-12">
								<label class="form-label">商品描述</label>
								<textarea name="productDescription" class="form-control"
									rows="3" maxlength="255"
									th:text="${product.productDescription}"></textarea>
							</div>

							<div class="col-md-4">
								<label class="form-label">價格 <span class="text-danger">*</span></label>
								<input type="number" name="productPrice" class="form-control"
									th:value="${product.productPrice}" min="0" step="1" required>
							</div>

							<div class="col-md-4">
								<label class="form-label">庫存 <span class="text-danger">*</span></label>
								<input type="number" name="stockQuantity" class="form-control"
									th:value="${product.stockQuantity}" min="0" step="1" required>
							</div>

							<div class="col-md-4">
								<label class="form-label">狀態</label> <select
									name="productStatus" class="form-select">
									<option value="1" th:selected="${product.productStatus == 1}">上架</option>
									<option value="0" th:selected="${product.productStatus == 0}">下架</option>
								</select>
							</div>

							<!-- 圖片區：檔名 + 上傳 + 預覽 -->
							<div class="col-md-8">
								<label class="form-label" for="pictureInput">圖片檔名</label> 
								<input type="text" id="pictureInput" name="productPicture"
								       class="form-control" th:value="${product.productPicture}"
								       th:attr="data-original-name=${product.productPicture}"
								       placeholder="例如：products/clothes.png">
								<div class="form-text">
									圖片由後端存到
									<code>/uploads</code>
									對應的實體目錄（
									<code>file.upload-dir</code>
									）。<br> 這裡只需填「檔名或相對路徑」，如：
									<code>products/clothes.png</code>
									。
								</div>

								<div class="mt-3">
									<label class="form-label" for="imageFile">上傳新圖片（不選擇則保留舊圖）</label>
									<input type="file" id="imageFile" name="imageFile"
										class="form-control" accept="image/*"> <small
										class="form-text text-muted">選擇後會即時預覽，並自動帶入檔名。</small>
								</div>
							</div>

							<div class="col-md-4 d-flex align-items-end">
								<img id="previewImage" data-mode="edit"
								     th:src="${product != null and product.productPicture != null} ?
								              @{/uploads/{f}(f=${product.productPicture})} :
								              @{/frontend-template/assets/img/default.png}"
								     th:attr="data-original-src=${product != null and product.productPicture != null} ?
								              @{/uploads/{f}(f=${product.productPicture})} :
								              @{/frontend-template/assets/img/default.png}"
								     onerror="this.src='/frontend-template/assets/img/default.png'"
								     class="img-fluid img-thumbnail w-100" alt="預覽圖片">
							</div>

						</div>
					</div>

					<div class="card-footer d-flex gap-2">
						<button type="submit" class="btn btn-primary">儲存修改</button>
						<a th:href="@{/admin/products}" class="btn btn-secondary">回列表</a>
					</div>
				</form>

			</div>
		</div>
	</div>

	<div id="empty-scripts" th:fragment="empty-scripts">
  <script>
  (() => {
	  console.log('[product] preview script loaded');
	  const file = document.getElementById('imageFile');
	  const nameInput = document.getElementById('pictureInput');
	  const preview = document.getElementById('previewImage');
	  let lastUrl = null;

	  if (!file || !preview) {
	    console.warn('[product] missing #imageFile or #previewImage');
	    return;
	  }

	  // 讀取原圖與原檔名（供還原用）
	  const originalSrc  = preview.getAttribute('data-original-src') || preview.src;
	  const originalName = nameInput ? (nameInput.getAttribute('data-original-name') ?? nameInput.value) : null;

	  file.addEventListener('change', () => {
	    const f = file.files && file.files[0];

	    // === 沒有選任何檔案（或被清空） → 一律還原成「原圖」與「原檔名」 ===
	    if (!f) {
	      if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
	      preview.onerror = null;
	      preview.src = originalSrc;
	      if (nameInput != null && originalName != null) nameInput.value = originalName;
	      return;
	    }

	    // 基本檔型與 URL 生命週期管理
	    if (!/^image\//i.test(f.type)) {
	      alert('請選擇圖片檔案');
	      file.value = '';
	      return;
	    }
	    if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }

	    const url = URL.createObjectURL(f);
	    lastUrl = url;

	    // 顯示本地預覽
	    preview.onerror = null;
	    preview.src = url;
	    preview.onload = () => {
	      if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
	    };

	    // 自動帶入檔名（若你不想改動文字框，可移除這行）
	    if (nameInput) nameInput.value = f.name;
	  });
	})();
  </script>
</div>
</body>
</html>
