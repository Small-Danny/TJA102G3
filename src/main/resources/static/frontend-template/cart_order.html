<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>訂單明細</title>

<!-- Bootstrap & Theme CSS -->
<link rel="stylesheet"
	href="/frontend-template/assets/css/bootstrap.min.css">
<link rel="icon" type="image/x-icon"
	href="/frontend-template/assets/images/heading-icon.png">
<link rel="stylesheet"
	href="/frontend-template/assets/css/owl.carousel.min.css">
<link rel="stylesheet"
	href="/frontend-template/assets/css/owl.theme.default.min.css">
<link rel="stylesheet"
	href="/frontend-template/assets/css/jquery.fancybox.min.css">
<link rel="stylesheet"
	href="/frontend-template/assets/css/fontawesome.min.css">
<link rel="stylesheet"
	href="/frontend-template/assets/css/nice-select.css">
<link rel="stylesheet" href="/frontend-template/assets/css/style.css">
<link rel="stylesheet"
	href="/frontend-template/assets/css/responsive.css">
<link rel="stylesheet" type="text/css"
	href="/frontend-template/assets/css/header.css">
<style> /* === 購物明細 === */
#order-items .order-item {
	display: flex;
	gap: 12px;
	align-items: center;
	margin: 10px 0;
}

#order-items .order-item img {
	width: 60px;
	height: 60px;
	object-fit: cover;
	border-radius: 8px;
}

#order-items .name {
	font-weight: 600;
}

#order-items .price {
	min-width: 100px;
	text-align: right;
}

#total-amount, #used-points, #order-amount, #grand-total {
	font-weight: 700;
} /* === 黑框總金額 === */
.cart-total-box {
	background: #000;
	color: #fff;
	padding: 16px 20px;
	border-radius: 8px;
	margin-top: 20px;
	width: 90%;
	max-width: 400px;
}

.cart-total-box .final ul, .cart-total-box .total ul {
	list-style: none;
	padding: 0;
	margin: 0;
}

.cart-total-box .final li, .cart-total-box .total li {
	display: flex;
	justify-content: space-between;
	margin: 8px 0;
}

.cart-total-box .total {
	background: #fff;
	color: #000;
	padding: 12px;
	border-radius: 6px;
	margin-top: 12px;
	font-size: 18px;
	font-weight: 700;
} /* === 收件資訊輸入框 === */
.billing input {
	width: 100%;
	margin-bottom: 30px;
	padding: 10px;
}

.error {
	color: red;
	font-size: 14px;
	margin-top: -8px;
	margin-bottom: 10px;
} /* === 付款按鈕區（右下角橫向） === */
.payment-method {
	display: flex;
	justify-content: flex-end;
	gap: 15px;
	margin-top: 20px;
}

.payment-method .checkout-btn {
	flex: 1;
	max-width: 220px;
	padding: 12px 20px;
	font-size: 16px;
	font-weight: 500;
	border-radius: 8px;
	border: none;
	color: #fff !important;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: all 0.3s ease;
}

#linePayBtn {
	background-color: #00B900;
}

#linePayBtn:hover {
	background-color: #009A00;
}

#creditCardBtn {
	background-color: #0d6efd;
}

#creditCardBtn:hover {
	background-color: #0b5ed7;
}
</style>
</head>
<body>
	<!-- Loader -->
	<div class="preloader">
		<div class="loader-wrap-heading">
			<div class="load-text">
				<span>L</span><span>o</span><span>a</span><span>d</span><span>i</span><span>n</span><span>g</span>
			</div>
		</div>
	</div>
	<!-- Header -->
	<div id="header-placeholder"></div>
	<!-- Banner -->
	<section class="banner-style-one">
		<div class="parallax"></div>
		<div class="container">
			<div class="row">
				<div class="banner-details">
					<h2>訂單明細</h2>
					<p>請確認您的訂單資訊並選擇付款方式</p>
				</div>
			</div>
		</div>
		<div class="breadcrums">
			<div class="container">
				<div class="row">
					<ul>
						<li><a href="index.html"> <i class="fa-solid fa-house"></i>
								<p>首頁</p></a></li>
					</ul>
				</div>
			</div>
		</div>
	</section>
	<!-- Checkout -->
	<section class="gap checkout detail-page">
		<form id="checkout-form">
			<div class="container">
				<div class="row">
					<!-- 左側：購物明細 -->
					<div class="col-lg-6 col-md-12">
						<div id="order-summary">
							<h3>購物明細</h3>
							<div id="order-items">
								<!-- checkout.js 填入 -->
							</div>
						</div>
						<div class="cart-total-box">
							<div class="final">
								<ul>
									<li><span>總金額:</span> <span id="total-amount">NT$0</span></li>
									<li><span>使用點數:</span> <span id="used-points">-NT$0</span></li>
									<li><span>訂單金額:</span> <span id="order-amount">NT$0</span></li>
								</ul>
							</div>
							<div class="total">
								<ul>
									<li><span>合計:</span> <span id="grand-total">NT$0</span></li>
								</ul>
							</div>
						</div>
					</div>
					<!-- 右側：寄件資訊 -->
					<div
						class="col-lg-6 col-md-12 d-flex flex-column justify-content-between">
						<div class="billing">
							<h3>寄件資訊</h3>
							<input id="recipient_name" name="recipientName" type="text"
								placeholder="收貨人姓名" required pattern="[\p{L}\p{M}\s\.\-]{2,10}"
								title="請輸入 2–10 字（中文或英文）">
							<div class="error"></div>
							<input id="recipient_phone" name="recipientPhone" type="tel"
								placeholder="收貨人電話" required
								pattern="^(09\d{8}|0\d{1,2}-?\d{7,8})$"
								title="手機 09xxxxxxxx 或市話 0x-xxxxxxx">
							<div class="error"></div>
							<input id="recipient_address" name="recipientAddress" type="text"
								placeholder="收貨人地址" required minlength="6" maxlength="120"
								title="收貨人地址需 6–120 字">
							<div class="error"></div>
						</div>
						<!-- 付款按鈕 -->
						<div class="payment-method">
							<button type="button" class="theme-btn checkout-btn"
								id="linePayBtn">
								<i class="fa-brands fa-line"
									style="font-size: 1.2em; margin-right: 8px;"></i><span>使用
									LINE Pay 付款</span>
							</button>
							<button type="button" class="theme-btn checkout-btn"
								id="creditCardBtn">
								<i class="fa-regular fa-credit-card" style="margin-right: 8px;"></i><span>使用信用卡付款</span>
							</button>
						</div>
					</div>
				</div>
			</div>
		</form>
	</section>
	<!-- Footer（簡版，依你原檔） -->
	<div id="footer-placeholder"></div>
	<div id="scroll-percentage">
		<span id="scroll-percentage-value"></span>
	</div>

	<!-- JS -->
	<!-- JS（已去重、正確載入順序） -->
	<script src="/frontend-template/assets/js/jquery.min.js"></script>
	<script src="/frontend-template/assets/js/bootstrap.min.js"></script>

	<!-- jQuery 外掛（依賴 jQuery） -->
	<script src="/frontend-template/assets/js/jquery.waypoints.min.js"></script>
	<script src="/frontend-template/assets/js/jquery.counterup.min.js"></script>
	<script src="/frontend-template/assets/js/jquery.fancybox.min.js"></script>
	<script src="/frontend-template/assets/js/jquery.nice-select.js"></script>
	<script src="/frontend-template/assets/js/owl.carousel.min.js"></script>

	<!-- 共用工具 -->
	<script src="/frontend-template/assets/js/api.js"></script>
	<script src="/frontend-template/assets/js/custom.js"></script>
	<script src="/frontend-template/assets/js/loader.js"></script>

	<!-- 本頁腳本 -->
	<script src="/frontend-template/assets/js/checkout.js"></script>
	<script src="/frontend-template/assets/js/load-header.js"></script>

	<!-- 頁面載入後關閉 preloader -->
	<script>
		window.addEventListener("load", function() {
			var pre = document.querySelector(".preloader");
			if (pre)
				pre.style.display = "none";
		});
	</script>

</body>
</html>
