    <style>
        :root {
            --sport-red: #e11d2e;
            /* 主紅 */
            --sport-red-dark: #c8102e;
            --sport-black: #111;
            /* 主黑 */
        }

        .task-tabs {
            gap: .5rem;
            flex-wrap: wrap;
        }

        .task-tabs .nav-link {
            position: relative;
            border: 2px solid var(--sport-black);
            color: var(--sport-black);
            background: #fff;
            font-weight: 800;
            letter-spacing: .02em;
            text-transform: none;
            border-radius: 999px;
            padding: .65rem 1.15rem;
            transition: .18s ease;
            box-shadow: 0 2px 0 rgba(0, 0, 0, .15);
        }

        .task-tabs .nav-link:hover {
            background: var(--sport-black);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, .15);
        }

        .task-tabs .nav-link.active {
            background: linear-gradient(135deg, var(--sport-red), var(--sport-red-dark));
            color: #fff !important;
            border-color: var(--sport-red-dark);
            box-shadow: 0 8px 18px rgba(225, 17, 30, .35);
            transform: translateY(-1px);
        }

        @media (max-width: 576px) {
            .task-tabs .nav-link {
                padding: .55rem .9rem;
                font-weight: 700;
            }
        }

        .section-head {
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .section-head img {
            width: 18px;
            height: 18px;
        }

        .task-card {
            background: #fff;
            border-radius: .75rem;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .06);
        }

        .task-table {
            width: 100%;
        }

        .task-table th,
        .task-table td {
            padding: .75rem;
        }

        .task-table tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .points {
            font-weight: 700;
            text-align: right;
        }

        @media (max-width: 768px) {
            .task-table thead {
                display: none;
            }

            .task-table tbody tr {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: .25rem .75rem;
                padding: .5rem 0;
            }

            .task-table td {
                padding: .25rem 0;
            }

            .task-table td[data-th]::before {
                content: attr(data-th) "：";
                font-weight: 600;
                margin-right: .25rem;
                color: #6c757d;
            }
        }
    </style>

    <script>
        // ====== API 基本設定 ======
        // const API_BASE = 'http://tibafit.ddns.net/';
        const API_BASE = (typeof window !== 'undefined' && window.API_BASE) ? window.API_BASE : '';
        function join(base, path) {
            return base.replace(/\/+$/, '') + '/' + path.replace(/^\/+/, '');
        }


        //  建立一筆（接取任務）— 不要再送 userId，交給後端從 Session 取出
        async function apiCreateTaskRecord(taskId) {
            const body = { taskId: Number(taskId) }; // 不帶 userId
            const res = await apiFetch(`/api/taskrecords`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(await res.text());
            return res.headers.get('content-type')?.includes('json') ? res.json() : null;
        }

        // 取 TaskRecord 列表
        async function apiListTaskRecords(query = {}) {
            const q = new URLSearchParams(query).toString();
            const url = `/api/taskrecords${q ? `?${q}` : ''}`;
            const res = await apiFetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
            const txt = await res.text().catch(() => '');
            if (!res.ok) throw new Error(`GET ${url} -> ${res.status}\n${txt}`);
            return txt ? JSON.parse(txt) : [];
        }

        // 取「可接任務」清單
        async function apiListAvailable() {
            const res = await apiFetch(`/api/tasks/available`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });
            const txt = await res.text().catch(() => '');
            if (!res.ok) throw new Error(`GET /api/tasks/available -> ${res.status}\n${txt}`);
            return txt ? JSON.parse(txt) : [];
        }

        //  標記完成（單筆）
        async function apiCompleteTaskRecord(recordId) {
            const res = await apiFetch(`/api/taskrecords/${recordId}/complete`, { method: 'PATCH' });
            if (!res.ok) throw new Error(await res.text());
        }

        // 把 TaskRecord 陣列用 taskId 批次補上任務資訊（先用 DTO 值，缺才用任務 API）
        async function enrichRecordsWithTasks(records) {
            const uniqueTaskIds = [...new Set(records.map(r => r.taskId))];
            const taskMap = new Map();

            const pick = (...vals) => {
                for (const v of vals) if (v !== undefined && v !== null && v !== '') return v;
                return null;
            };

            return records.map(r => {
                const t = taskMap.get(String(r.taskId)) || {};
                const name = pick(r.taskName, r.task_name, t.taskName, t.task_name, '');
                const targetValue = pick(r.targetValue, r.target_value, t.targetValue, t.target_value, null);
                const unit = pick(r.unit, t.unit, '');
                const points = pick(r.points, t.points, 0);

                return {
                    // TaskRecord 本體
                    recordId: String(r.taskRecordId ?? r.id ?? ''),
                    taskId: String(r.taskId),
                    userStartTime: r.userStartTime,
                    userEndTime: r.userEndTime,
                    statusId: r.statusId,
                    statusName: r.statusName,

                    // 任務資訊（同時放駝峰，renderCurrent 讀得到）
                    taskName: name,
                    targetValue: targetValue,
                    unit: unit,
                    points: points,

                    // 圖示
                    task_icon: join(API_BASE, `/tasks/${r.taskId}/icon`)
                };
            });
        }

        // 只取年/月/日（YYYY/MM/DD）
        function toYMD(v) {
            if (!v) return '';
            const s = String(v);
            const m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
            const pad2 = n => String(n).padStart(2, '0');
            if (m) return `${m[1]}/${pad2(m[2])}/${pad2(m[3])}`;

            const d = new Date(s);
            if (!isNaN(d)) return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;

            return s;
        }



    </script>


    <script>


        // ===== 狀態儲存：移除假資料後，仍需有 localStorage 讀寫與預設空結構 =====
        const STORAGE_KEY = 'fithub.tasks.v2';
        const todayStr = () => { const d = new Date(); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return { available: [], current: [], completed: [] };
                const s = JSON.parse(raw);
                const toArr = v => Array.isArray(v) ? v : [];
                return { available: toArr(s.available), current: toArr(s.current), completed: toArr(s.completed) };
            } catch {
                return { available: [], current: [], completed: [] };
            }
        }

        function saveState() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { }
        }

        let state = loadState();

        //===== 渲染三個表格 =====
        function renderCurrent() {
            const safe = (v, d = '') => (v ?? d);
            const first = (...xs) => xs.find(v => v !== undefined && v !== null && v !== '') ?? '';

            const rows = [];
            rows.push(`<thead><tr>
    <th>任務名稱</th><th>任務目標值</th><th>單位</th>
    <th>任務開始日</th><th>點數</th><th>任務圖騰</th><th></th>
  </tr></thead><tbody>`);

            /*state.current.forEach(m => {*/
            const list = (state.current || []).filter(m =>
                m?.statusId === 0 || m?.status === '進行中'
            );
            list.forEach(m => {
                const recordId = safe(m.recordId);
                const taskId = safe(m.id ?? m.taskId);
                const name = first(m.taskName, m.task_name);
                const targetVal = first(m.targetValue, m.target_value);
                const unit = safe(m.unit);
                const startAt = toYMD(safe(m.start_time));
                const endAt = safe(m.end_time);
                const points = safe(m.points, 0);
                const iconUrl = first(m.task_icon, `${API_BASE.replace(/\/+$/, '')}/tasks/${taskId}/icon`);
                const statusText = first(m.status, m.statusName, (m.statusId === 0 ? '進行中' : ''));
                const isOngoing = (statusText === '進行中') || (m.statusId === 0);
                const icon = m.task_icon ?? join(API_BASE, `/tasks/${m.id}/icon`);

                rows.push(`<tr>
      <td data-th="任務名稱">${name}</td>
      <td data-th="任務目標值">${targetVal ?? ''}</td>
      <td data-th="單位">${unit}</td>
      <td data-th="任務開始日">${startAt}</td>
      <td data-th="點數">${points}</td>
      <td data-th="任務圖騰">
        <img src="${icon}" alt="任務圖示" width="160" onerror="this.src='fallback.png'">
      </td>
      <td data-th="操作">${isOngoing
                        ? `<button class="btn btn-sm btn-outline-dark"
                data-action="complete"
                data-record-id="${recordId}"
                data-task-id="${taskId}">標記完成</button>`
                        : ''
                    }</td>
    </tr>`);
            });

            rows.push('</tbody>');
            document.getElementById('table-current').innerHTML = rows.join('');
        }


        function renderAvailable() {
            const rows = [];
            rows.push(`<thead><tr>
    <th>任務名稱</th><th>任務目標值</th><th>單位</th>
    <th>點數</th><th>任務圖騰</th><th></th>
  </tr></thead><tbody>`);

            (state.available || []).forEach(m => {
                const icon = m.task_icon ?? `${API_BASE.replace(/\/+$/, '')}/tasks/${m.id}/icon`;
                rows.push(`<tr>
      <td data-th="任務名稱">${m.taskName ?? ''}</td>
      <td data-th="任務目標值">${m.targetValue ?? ''}</td>
      <td data-th="單位">${m.unit ?? ''}</td>
      <td data-th="點數">${m.points ?? 0}</td>
      <td data-th="任務圖騰">
        <img src="${icon}" alt="任務圖示" width="160" onerror="this.src='fallback.png'">
      </td>
      <td data-th="操作">
        <button class="btn btn-sm btn-outline-dark"
                data-action="accept" data-task-id="${m.id}">接取任務</button>
      </td>
    </tr>`);
            });

            rows.push('</tbody>');
            document.getElementById('table-available').innerHTML = rows.join('');
        }


        function renderCompleted() {
            const rows = [];
            rows.push(`<thead><tr>
    <th>任務名稱</th><th>任務目標值</th><th>單位</th>
    <th>任務開始日</th><th>任務結束日</th><th>點數</th><th>任務圖騰</th><th></th>
  </tr></thead><tbody>`);

            const list = (state.completed || []).filter(m =>
                m?.statusId === 1 || m?.status === '已完成' || (m?.end_time && m.end_time !== '')
            );

            list.forEach(m => {
                const icon = m.task_icon ?? `${API_BASE.replace(/\/+$/, '')}/tasks/${m.id}/icon`;
                rows.push(`<tr>
      <td data-th="任務名稱">${m.taskName ?? ''}</td>
      <td data-th="任務目標值">${m.targetValue ?? ''}</td>
      <td data-th="單位">${m.unit ?? ''}</td>
      <td data-th="任務開始日">${toYMD(m.start_time) || ''}</td>
      <td data-th="任務結束日">${toYMD(m.end_time) || ''}</td>
      <td data-th="點數">${m.points ?? 0}</td>
      <td data-th="任務圖騰"><img src="${icon}" alt="任務圖示" width="160" onerror="this.src='fallback.png'"></td>
      <td></td>
    </tr>`);
            });

            rows.push('</tbody>');
            document.getElementById('table-completed').innerHTML = rows.join('');
        }


        function renderAll() { renderCurrent(); renderAvailable(); renderCompleted(); }

        //===== 事件委派（接取／完成） =====
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action]'); if (!btn) return;
            const action = btn.getAttribute('data-action');

            if (action === 'accept') {
                const tid = btn.getAttribute('data-task-id');
                if (!tid) { alert('找不到任務 ID'); return; }

                const oldText = btn.textContent;
                btn.disabled = true; btn.textContent = '接取中…';

                try {

                    await apiCreateTaskRecord(Number(tid));
                    await reloadAll();


                } catch (err) {

                    alert('接取失敗：\n' + err.message);
                    console.error(err);
                } finally {
                    btn.disabled = false; btn.textContent = oldText;
                }
            }

            if (action === 'complete') {

                const rid = btn.getAttribute('data-record-id');
                const tid = btn.getAttribute('data-task-id');

                if (!rid) {
                    alert('找不到 TaskRecord recordId，請重新整理後再試一次。');
                    return;
                }

                const oldText = btn.textContent;
                btn.disabled = true; btn.textContent = '標記中…';
                try {
                    await apiCompleteTaskRecord(rid);
                    await reloadAll();
                } catch (err) {
                    alert('標記完成失敗：\n' + err.message);
                    console.error(err);
                } finally {
                    btn.disabled = false; btn.textContent = oldText;
                }
            }
        });

        async function reloadAll() {
            state = loadState();
            state.completed = state.completed || [];

            try {

                const avail = await apiListAvailable();
                state.available = avail.map(t => ({
                    id: String(t.taskId ?? t.id),
                    taskName: t.taskName ?? t.task_name ?? '',
                    targetValue: t.targetValue ?? t.target_value ?? null,
                    unit: t.unit ?? '',
                    points: t.points ?? 0,
                }));

                // B) 現有任務（current）從 TaskRecord 撈：statusId=0
                const records = await apiListTaskRecords({ statusId: 0 });
                const currentEnriched = await enrichRecordsWithTasks(records);


                state.current = currentEnriched.map(r => ({
                    id: r.taskId,
                    recordId: r.recordId,
                    user_id: r.userId ?? r.userVO?.userId ?? '',
                    taskName: r.taskName,
                    targetValue: r.targetValue,
                    unit: r.unit,
                    start_time: r.userStartTime ?? '',
                    end_time: r.userEndTime ?? '',
                    points: r.points,
                    task_icon: r.task_icon,
                    statusId: r.statusId,
                    status: r.statusName ?? (r.statusId === 0 ? '進行中' : '')
                }));

                // D) 已完成任務（completed）從 TaskRecord 撈：statusId=1
                const completedRecords = await apiListTaskRecords({ statusId: 1 });
                const completedEnriched = await enrichRecordsWithTasks(completedRecords);

                state.completed = completedEnriched.map(r => ({
                    id: r.taskId,
                    recordId: r.recordId,
                    taskName: r.taskName,
                    targetValue: r.targetValue,
                    unit: r.unit,
                    start_time: r.userStartTime ?? '',
                    end_time: r.userEndTime ?? '',
                    points: r.points,
                    task_icon: r.task_icon,
                    statusId: r.statusId,
                    status: r.statusName ?? '已完成'
                }));

                saveState();
            } catch (e) {
                console.warn('載入資料失敗，使用本機資料：', e);
            } finally {
                renderAll();
            }
        }
        reloadAll();

        ; (() => {
            const links = document.querySelectorAll('.task-tabs .nav-link')
            if (!links.length) return
            links.forEach(link => {
                link.addEventListener('click', () => {
                    const targetSel = link.getAttribute('data-bs-target')
                    const target = targetSel ? document.querySelector(targetSel) : null
                    document.querySelectorAll('.task-tabs .nav-link').forEach(b => b.classList.remove('active'))
                    document.querySelectorAll('.tab-content .tab-pane').forEach(p => p.classList.remove('active', 'show'))
                    link.classList.add('active')
                    if (target) { target.classList.add('active', 'show') }
                })
            })
        })()
    </script>
