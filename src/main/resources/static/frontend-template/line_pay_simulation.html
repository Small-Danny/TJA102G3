<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在前往 LINE Pay...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #f5f5f5;
        }
        .loader p { font-size: 18px; color: #333; margin-top: 20px; }
        /* 簡單的 loading spinner */
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #00B900; /* LINE Pay Green */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader">
        <div class="spinner"></div>
        <p>正在為您安全地導向至 LINE Pay 付款頁面...</p>
    </div>

    <script>
        // 取得儲存在 sessionStorage 中的訂單 ID
        const orderId = sessionStorage.getItem('orderId');

        // 引入我們共用的 api.js
        const script = document.createElement('script');
        script.src = '/frontend-template/assets/js/api.js';
        document.head.appendChild(script);

        script.onload = function() {
            // 這個函式會在 api.js 載入後執行
            async function redirectToLinePay() {
                if (!orderId) {
                    alert('找不到訂單資訊，將返回購物車');
                    window.location.href = '/frontend-template/cart.html';
                    return;
                }

                try {
                    // 步驟 1: 呼叫後端 API，取得「真實的」LINE Pay 付款網址
                    const linePayResponse = await apiFetch('/api/line-pay/request', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderId: parseInt(orderId) })
                    });

                    if (!linePayResponse.ok) {
                        throw new Error('無法從後端取得 LINE Pay 連結');
                    }

                    const linePayData = await linePayResponse.json();
                    const paymentUrl = linePayData.paymentUrl;

                    if (paymentUrl) {
                        // 步驟 2: 跳轉到真實的 LINE Pay 沙箱頁面
                        console.log('取得 LINE Pay 網址，正在跳轉:', paymentUrl);
                        window.location.href = paymentUrl;
                    } else {
                        throw new Error('後端未回傳有效的 LINE Pay 連結');
                    }

                } catch (error) {
                    console.error('導向 LINE Pay 失敗:', error);
                    alert('無法連接至 LINE Pay，請稍後再試。');
                    window.location.href = '/frontend-template/cart_order.html'; // 跳回結帳頁
                }
            }
            
            // 執行跳轉
            redirectToLinePay();
        };
    </script>

</body>
</html>
