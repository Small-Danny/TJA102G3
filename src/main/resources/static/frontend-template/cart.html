<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <style>
    /* 任何時候，只要 body 有 page-loaded 就把 preloader 關掉 */
    body.page-loaded .preloader {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* 絕對保險：最多 3 秒自動收起（就算 onload 沒觸發） */
    @keyframes preloaderTimeout {
      to {
        display: none;
        opacity: 0;
        visibility: hidden;
      }
    }

    .preloader {
      animation: preloaderTimeout 0s linear 3s forwards;
    }
  </style>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>購物車</title>

  <!-- 样式（照你現有專案） -->
  <link rel="stylesheet" href="/frontend-template/assets/css/bootstrap.min.css" />
  <link rel="icon" type="image/x-icon" href="/frontend-template/assets/images/heading-icon.png" />
  <link rel="stylesheet" href="/frontend-template/assets/font/flaticon_mycollection.css" />
  <link rel="stylesheet" href="/frontend-template/assets/css/owl.carousel.min.css" />
  <link rel="stylesheet" href="/frontend-template/assets/css/owl.theme.default.min.css" />
  <link rel="stylesheet" href="/frontend-template/assets/css/jquery.fancybox.min.css" />
  <link rel="stylesheet" href="/frontend-template/assets/css/fontawesome.min.css" />
  <link rel="stylesheet" href="/frontend-template/assets/css/nice-select.css" />
  <link rel="stylesheet" href="/frontend-template/assets/css/style.css" />
  <link rel="stylesheet" href="/frontend-template/assets/css/responsive.css" />

  <style>
    /* 你原本 header 版面的小調整（可留可刪） */
    .social-item {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .header-style-one .nav-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%
    }

    .header-style-one .nav-bar>ul {
      flex: 1 1 auto;
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none
    }

    .header-style-one .nav-bar .extras {
      flex: 0 0 auto
    }

  /* 最終修正 cart.html header */
  .header-style-one .desktop-nav .d-flex-all {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-style-one .extras .shopping-bag {
    display: none !important; /* 在購物車頁面，直接移除多餘的 header 購物車圖示 */
  }
  </style>
</head>

<body>

  <script>
    // 有些版塊一定會塞很多圖，載不到就隱藏，不要一直報錯影響使用者
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'IMG') { t.style.display = 'none'; }
    }, true);
  </script>

  <!-- Loader -->
  <div class="preloader">
    <div class="loader-wrap-heading">
      <div class="load-text">
        <span>L</span><span>o</span><span>a</span><span>d</span><span>i</span><span>n</span><span>g</span>
      </div>
    </div>
  </div>

  <!-- Header 會以 AJAX 載入 -->
  <div id="header-placeholder"></div>

  <!-- Banner -->
  <section class="banner-style-one">
    <div class="parallax"></div>
    <div class="container">
      <div class="row">
        <div class="banner-details">
          <h2>購物車</h2>
          <p>our values and vaulted us to the top of our industry.</p>
        </div>
      </div>
    </div>
    <div class="breadcrums">
      <div class="container">
        <div class="row">
          <ul>
            <li>
              <a href="index.html">
                <i class="fa-solid fa-house"></i>
                <p>首頁</p>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- Cart -->
  <section class="gap cart">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">

          <div class="cart-box">
            <!-- 表頭 -->
            <ul class="cart-table head">
              <li>
                <div class="c-c">
                  <div class="c-data"><span>商品</span></div>
                  <div class="c-price"><span>價格</span></div>
                  <div class="c-quality"><span>數量</span></div>
                  <div class="c-total"><span>合計</span></div>
                </div>
              </li>
            </ul>

            <!-- ⚠️ 動態清單容器（由 assets/js/cart.js 渲染） -->
            <ul class="cart-table" id="cartList"></ul>
          </div>

          <div class="update-cart d-flex-all justify-content-end">
            <!-- ⚠️ 下一步按鈕（JS 會把購物車與金額存到 localStorage，再跳頁） -->
            <a href="cart_order.html" class="theme-btn" id="btnNext">下一步</a>
          </div>

        </div>
      </div>

      <!-- 右下角金額 -->
      <div class="row cart-total">
        <div class="col-lg-6"></div>
        <div class="col-lg-6">
          <div class="cart-total-box">
            <div class="final">
              <ul>
                <li>
                  <span>總金額:</span>
                  <!-- ⚠️ 小計(所有項目單價*數量加總) -->
                  <span id="sum-subtotal">0</span>
                </li>
                <li>
                  <span>使用點數:</span>
                  <!-- ⚠️ 想只顯示文字可改回 span；這裡提供可輸入點數 -->
                  <input id="usePoints" type="number" min="0" value="0" style="width:120px">
                </li>
                <li>
                  <span>訂單金額:</span>
                  <!-- ⚠️ subtotal - usedPoints -->
                  <span id="sum-order">0</span>
                </li>
              </ul>
            </div>
            <div class="total">
              <ul>
                <li>
                  <span>合計:</span>
                  <!-- ⚠️ 目前與訂單金額相同（沒有運費/手續費） -->
                  <span id="sum-grand">0</span>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer（簡版，依你原檔） -->
  <div id="footer-placeholder"></div>

  <!-- 捲動百分比（若不需可移除） -->
  <div id="scroll-percentage"><span id="scroll-percentage-value"></span></div>

  <!-- Scripts（順序依你原專案） -->
  <script src="/frontend-template/assets/js/jquery.min.js"></script>
  <script src="/frontend-template/assets/js/jquery.waypoints.min.js"></script>

  <script src="/frontend-template/assets/js/jquery.counterup.min.js"></script>
  <script src="/frontend-template/assets/js/bootstrap.min.js"></script>
  <script src="/frontend-template/assets/js/jquery.fancybox.min.js"></script>
  <script src="/frontend-template/assets/js/jquery.nice-select.js"></script>
  <script src="/frontend-template/assets/js/owl.carousel.min.js"></script>
  <script src="/frontend-template/assets/js/loader.js"></script>
  <script src="/frontend-template/assets/js/custom.js"></script>
  <script src="/frontend-template/assets/js/api.js"></script>
  <script src="/frontend-template/assets/js/cart-page.js"></script>
</body>

</html>
