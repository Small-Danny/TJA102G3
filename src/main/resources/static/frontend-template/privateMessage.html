<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發送私訊</title>
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/style.css">
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/responsive.css">
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/header.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<style>
body {
	background-color: #f5f5f5;
	font-family: "Microsoft JhengHei", Arial, sans-serif;
}
.message-container {
	max-width: 800px;
	background: #fff;
	border-radius: 10px;
	padding: 30px;
	margin: 50px auto; /* 置中並離 banner 保留距離 */
	box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}
h2 {
	font-weight: bold;
	color: #c62828;
	margin-bottom: 30px;
}
label {
	font-weight: 600;
	color: #555;
}
.btn-primary {
	background-color: #c62828;
	border: none;
	border-radius: 8px;
}
.btn-primary:hover {
	background-color: #e53935;
}
.btn-secondary {
	border-radius: 8px;
}
.form-control {
	border-radius: 6px;
}
.btn-home-float {
	position: fixed;
	bottom: 20px;
	right: 20px;
	display: inline-flex;
	align-items: center;
	gap: 5px;
	padding: 10px 16px;
	border-radius: 30px;
	background: #c62828;
	color: #fff;
	font-weight: 500;
	text-decoration: none;
	box-shadow: 0 3px 8px rgba(0,0,0,0.2);
	transition: 0.3s;
	z-index: 999;
}
.btn-home-float:hover {
	background-color: #e53935;
}
</style>
</head>

<body>
<div id="header-placeholder"></div>

<section class="banner-style-one">
  <div class="parallax"></div>
  <div class="container">
    <div class="row">
      <div class="banner-details">
        <h2>討論區</h2>
        <p>歡迎回來！管理您的個人資料與服務</p>
      </div>
    </div>
  </div>
</section>

<div class="message-container">
	<h2><i class="fa-regular fa-envelope"></i> 發送私人訊息</h2>

	<form id="sendMessageForm">
		<div class="form-group">
			<label for="receiverName">收件人</label>
			<input type="text" id="receiverName" class="form-control" value="" readonly>
		</div>

		<div class="form-group">
			<label for="msgTitle">主題</label>
			<input type="text" id="msgTitle" class="form-control" placeholder="請輸入主題">
		</div>

		<div class="form-group">
			<label for="msgContent">內容</label>
			<textarea id="msgContent" rows="6" class="form-control" placeholder="請輸入訊息內容..."></textarea>
		</div>

		<div class="text-right mt-4">
			<button type="button" class="btn btn-secondary mr-2" onclick="history.back()">取消</button>
			<button type="submit" class="btn btn-primary">發送</button>
		</div>
	</form>
</div>

<a href="/frontend-template/forum.html" class="btn-home-float">
	<i class="fas fa-home"></i> 回討論區
</a>

<script>
document.addEventListener("DOMContentLoaded", function() {
	const form = document.getElementById("sendMessageForm");
	const params = new URLSearchParams(window.location.search);

	const receiverId = params.get("receiverUserId");
	const relatedArticleId = params.get("articleId") || null;

	// 取得收件人名稱
	async function loadReceiverName() {
		if (!receiverId) return;
		try {
			const res = await fetch(`/api/forum/member/${receiverId}`);
			if (!res.ok) throw new Error("無法取得使用者資料");
			const data = await res.json();
			document.getElementById("receiverName").value = data.nickName || "未知使用者";
		} catch (err) {
			console.error(err);
			document.getElementById("receiverName").value = "未知使用者";
		}
	}
	loadReceiverName();

	const currentUserId = 1; // TODO: 從 session 或後端取得

	form.addEventListener("submit", async function(e) {
		e.preventDefault();

		const title = document.getElementById("msgTitle").value.trim();
		const content = document.getElementById("msgContent").value.trim();

		if (!title || !content) {
			Swal.fire("請填寫完整內容！", "", "warning");
			return;
		}

		const messageData = {
			senderUserId: currentUserId,
			receiverUserId: receiverId,
			relatedArticleId: relatedArticleId,
			title: title,
			content: content,
			messageType: "會員訊息"
		};

		try {
			const response = await fetch("/api/messages/send", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(messageData)
			});

			const result = await response.json();

			if (response.ok && result.success) {
				Swal.fire({
					icon: "success",
					title: "訊息已發送！",
					showConfirmButton: false,
					timer: 1500
				}).then(() => {
					history.back(); // 發送後回到上一頁
				});
			} else {
				Swal.fire("發送失敗", result.message || "請稍後再試", "error");
			}
		} catch (error) {
			console.error("發送錯誤：", error);
			Swal.fire("伺服器發生錯誤", error.message, "error");
		}
	});
});
</script>

<div id="footer-placeholder"></div>
<script src="/frontend-template/assets/js/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/frontend-template/assets/js/api.js"></script>
<script src="/frontend-template/assets/js/loader.js"></script>
<script src="/frontend-template/assets/js/custom.js"></script>
</body>
</html>
