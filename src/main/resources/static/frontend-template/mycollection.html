<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏</title>
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/bootstrap.min.css">
<link rel="icon" type="image/x-icon" href="/frontend-template/assets/images/heading-icon.png">
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/style.css">
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/responsive.css">
<link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/header.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body {
	background: #f5f5f5;
	font-family: Arial, sans-serif;
}

.container {
	margin-top: 0px;
}
.container2 {
    max-width: 800px;
    margin: 20px auto;
}

/* 收藏卡片 */
.collection-card {
	background: #fff;
	padding: 20px;
	border-radius: 10px;
	box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
	margin-bottom: 20px;
	height: 700px;
    overflow-y: auto;
}

.collection-card h5 {
	border-left: 4px solid #c62828;
	padding-left: 8px;
	color: #c62828;
	margin-bottom: 15px;
}

/* 收藏項目 */
.collection-item {
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 12px 16px;
	border-bottom: 1px solid #eee;
	transition: opacity 0.3s ease, transform 0.3s ease;
}

.collection-item:last-child {
	border-bottom: none;
}

.collection-main {
	display: flex;
	align-items: center;
	gap: 16px;
}

.collection-main img {
	width: 100px;
	height: 70px;
	object-fit: cover;
	border-radius: 6px;
}

.collection-info h6 {
	margin: 0 0 4px;
	font-size: 1rem;
}

.collection-info h6 a {
	color: #555;
	text-decoration: none;
	transition: 0.3s;
}

.collection-info h6 a:hover {
	color: #c62828;
	text-decoration: underline;
}

.collection-info p {
	margin: 0;
	font-size: 0.875rem;
	color: #666;
}

/* 刪除按鈕 */
.btn-remove {
	border-radius: 5px;
	font-size: 14px;
	display: flex;
	align-items: center;
	gap: 5px;
	color: #c62828;
	border: 1px solid #c62828;
	background: #fff;
	transition: 0.3s;
}

.btn-remove:hover {
	background: #c62828;
	color: #fff;
}

/* 浮動回首頁按鈕 */
.btn-home-float {
	position: fixed;
	bottom: 20px;
	right: 20px;
	display: inline-flex;
	align-items: center;
	gap: 5px;
	padding: 10px 16px;
	border-radius: 30px;
	background: #c62828;
	color: #fff;
	font-weight: 500;
	text-decoration: none;
	box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
	transition: 0.3s;
	z-index: 999;
}

.btn-home-float:hover {
	background: #e53935;
}

/* 漸變消失效果 */
.fade-out {
	opacity: 0;
	transform: translateX(50px);
}

/* 分頁按鈕 */
.pagination .page-item .page-link {
    color: #c62828;            /* 文字顏色 */
    border: 1px solid #c62828; /* 邊框顏色 */
    margin: 0 2px;
    transition: 0.3s;
}

.pagination .page-item.active .page-link {
    background-color: #c62828; /* 選中頁背景 */
    color: #fff;               /* 選中頁文字 */
    border-color: #c62828;
}

.pagination .page-item .page-link:hover {
    background-color: #e53935;
    color: #fff;
    border-color: #e53935;
}

</style>
</head>
<body>
<div id="header-placeholder"></div>

<section class="banner-style-one">
	<div class="parallax"></div>
	<div class="container">
		<div class="row">
			<div class="banner-details">
				<h2>討論版</h2>
				<p>歡迎回來！管理您的個人資料與服務</p>
			</div>
		</div>
	</div>
</section>

<div class="container2">
	<!-- 收藏卡片 -->
	<div class="collection-card">
		<h5>我的收藏文章</h5>
		<div id="collectionList"></div>
		<nav>
			<ul id="pagination" class="pagination justify-content-center mt-3"></ul>
		</nav>
	</div>
</div>

<!-- 浮動回首頁按鈕 -->
<a href="/frontend-template/forum.html" class="btn-home-float"><i class="fas fa-home"></i> 回討論區</a>

<!-- 登入燈箱 -->
<div id="loginModal" class="modal fade" tabindex="-1">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-body text-center p-4">
				<i class="fas fa-exclamation-triangle fa-2x text-warning mb-2"></i>
				<h5 class="mb-2">尚未登入</h5>
				<p>請先登入 Tibafit！</p>
				<div class="d-flex justify-content-center gap-3">
					<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">否</button>
					<button type="button" class="btn btn-success" onclick="window.location.href='/login'">是</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const itemsPerPage = 5;
    let currentPage = 1;
    let collectionData = [];

    function showLoginModal() {
        new bootstrap.Modal(document.getElementById('loginModal')).show();
    }

    function getCsrfTokenFromCookie() {
        const match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
    }

    function renderPage(page) {
        const list = document.getElementById('collectionList');
        list.innerHTML = '';

        if (!collectionData || collectionData.length === 0) {
            list.innerHTML = '<p class="text-muted">目前沒有收藏文章</p>';
            return;
        }

        const start = (page - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = collectionData.slice(start, end);

        pageItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'collection-item';
            row.dataset.id = item.articleId;

            const mainDiv = document.createElement('div');
            mainDiv.className = 'collection-main';
            mainDiv.innerHTML = `
                <img src="${item.coverImageUrl || '/images/default.jpg'}" alt="封面">
                <div class="collection-info">
                    <h6><a href="article-detail.html?id=${item.articleId}">${item.title}</a></h6>
                    <p>作者：${item.authorName}</p>
                    <p class="small">發布於：${item.createTime}</p>
                </div>
            `;

            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn-remove';
            removeBtn.innerHTML = '<i class="fas fa-trash-alt"></i> 刪除';
            removeBtn.addEventListener('click', () => {
                if (!confirm('確定要取消收藏嗎？')) return;

                fetch(`/api/mycollection/${item.articleId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-XSRF-TOKEN': getCsrfTokenFromCookie()
                    },
                    credentials: 'include'
                })
                .then(res => res.json())
                .then(resData => {
                    if (!resData.success) {
                        if (resData.message === "尚未登入") {
                            showLoginModal();
                        } else {
                            alert(resData.message);
                        }
                        return;
                    }

                    collectionData = collectionData.filter(c => c.articleId !== item.articleId);
                    if ((currentPage - 1) * itemsPerPage >= collectionData.length) {
                        currentPage = Math.max(1, currentPage - 1);
                    }
                    renderPage(currentPage);
                })
                .catch(err => {
                    alert('刪除收藏失敗，請稍後再試');
                    console.error(err);
                });
            });

            row.appendChild(mainDiv);
            row.appendChild(removeBtn);
            list.appendChild(row);
        });

        renderPagination();
    }

    function renderPagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        const totalPages = Math.ceil(collectionData.length / itemsPerPage);
        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
            li.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = i;
                renderPage(currentPage);
            });
            pagination.appendChild(li);
        }
    }

    function loadCollection() {
        fetch('/api/mycollection')
            .then(res => res.json())
            .then(data => {
                collectionData = data || [];
                renderPage(currentPage);
            });
    }

    loadCollection();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div id="footer-placeholder"></div>
<script src="/frontend-template/assets/js/jquery.min.js"></script>
<script src="/frontend-template/assets/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/frontend-template/assets/js/api.js"></script>
<script src="/frontend-template/assets/js/loader.js"></script>
<script src="/frontend-template/assets/js/custom.js"></script>
<script src="/frontend-template/assets/js/profile.js"></script>
</body>
</html>
