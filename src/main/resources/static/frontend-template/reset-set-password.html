<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼</title>
    <link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/bootstrap.min.css">
    <link rel="icon" type="image/x-icon" href="/frontend-template/assets/images/heading-icon.png">
    <link rel="stylesheet" href="/frontend-template/assets/font/flaticon_mycollection.css">
    <link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/fontawesome.min.css">
    <link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/style.css">
    <link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/responsive.css">
    <link rel="stylesheet" type="text/css" href="/frontend-template/assets/css/header.css">
    <style>
        .box.reset-password {
            background-color: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1)
        }

        .box.reset-password h3 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600
        }

        .box.reset-password p {
            color: #666;
            text-align: center;
            margin-bottom: 30px
        }

        .form-group {
            position: relative;
            padding-bottom: 22px;
            margin-bottom: 5px
        }

        .box.reset-password input {
            width: 100%;
            padding: 12px 15px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            color: #333;
            font-size: 16px;
            height: 46px;
            box-sizing: border-box;
            transition: all .2s ease
        }

        .box.reset-password input:focus {
            outline: none;
            border-color: #EA2127;
            box-shadow: 0 0 0 2px rgba(234, 33, 39, .2)
        }

        .password-wrapper {
            position: relative
        }

        .box.reset-password .password-wrapper input {
            padding-right: 40px !important
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #555
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            margin-bottom: 5px
        }

        .error-message.show {
            display: block
        }

        .password-strength {
            height: 5px;
            margin-top: 8px;
            border-radius: 3px;
            background-color: #eee;
            overflow: hidden;
            display: none
        }

        .password-strength.show {
            display: block
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width .3s ease
        }

        .strength-weak {
            width: 33%;
            background-color: #dc3545
        }

        .strength-medium {
            width: 66%;
            background-color: #ff8c00
        }

        .strength-strong {
            width: 100%;
            background-color: #28a745
        }

        .password-hint {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            margin-bottom: 5px;
            padding: 8px 12px;
            background-color: #e9ecef;
            border-radius: 4px;
            border-left: 3px solid #6c757d
        }

        .theme-btn {
            background-color: #EA2127;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all .3s ease;
            width: 100%;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box
        }

        .theme-btn:hover {
            background-color: #bb2d3b
        }

        .back-link {
            text-align: center;
            display: block;
            color: #007bff;
            text-decoration: none;
            margin-top: 15px
        }

        input[type=password]::-ms-reveal {
            display: none
        }
    </style>
</head>

<body>
    <header>
        <div id="header"></div>
    </header>
    <section class="banner-style-one">
        <div class="parallax" style="background-image: url(https://via.placeholder.com/1920x640);"></div>
        <div class="container">
            <div class="row">
                <div class="banner-details">
                    <h2>重設密碼</h2>
                    <p>請設定您的新密碼</p>
                </div>
            </div>
        </div>
    </section>
    <section class="gap login-register">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="box reset-password">
                        <h3>設定您的新密碼</h3>
                        <p id="page-description">請輸入並確認您的新密碼。</p>
                        <form id="resetPasswordForm">
                            <div class="form-group">
                                <div class="password-wrapper">
                                    <input type="password" name="newPassword" id="newPassword" placeholder="新密碼"
                                        required>
                                    <i class="fa-solid fa-eye toggle-password" data-target="newPassword"></i>
                                </div>
                                <div class="password-strength">
                                    <div class="strength-bar" id="strengthBar"></div>
                                </div>
                                <div class="password-hint">密碼強度：至少8位，包含大寫字母、小寫字母、數字和特殊字符</div>
                                <div class="error-message" id="newPasswordError"></div>
                            </div>
                            <div class="form-group">
                                <div class="password-wrapper">
                                    <input type="password" name="confirmPassword" id="confirmPassword"
                                        placeholder="確認密碼" required>
                                    <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
                                </div>
                                <div class="error-message" id="confirmPasswordError"></div>
                            </div>
                            <button type="submit" class="theme-btn" id="submitBtn">確認重置密碼</button>
                            <a href="/frontend-template/login.html" class="back-link">返回登入頁面</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // --- 輔助函式 (完整版) ---
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
            }
        }
        function clearAllErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.classList.remove('show');
            });
        }

        // --- 主邏輯 ---
        document.addEventListener('DOMContentLoaded', function () {
            // 加載頁首（修正路径：添加 /frontend-template/ 前缀，避免路径错误）
            fetch('/frontend-template/header.txt?v=' + Date.now(), { cache: 'no-store' })
                .then(r => r.text())
                .then(html => { 
                    if (document.getElementById('header')) {
                        document.getElementById('header').innerHTML = html; 
                    }
                })
                .catch(error => console.error('加載頁首失敗:', error));

            // 變量聲明
            const resetPasswordForm = document.getElementById('resetPasswordForm');
            const submitBtn = document.getElementById('submitBtn'); // 新增：按鈕元素，用於禁用防止重複提交
            const pageDescription = document.getElementById('page-description');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const strengthBar = document.getElementById('strengthBar');
            const passwordStrength = document.querySelector('.password-strength');

            // --- 區塊 1：頁面載入時，從網址獲取並驗證 Token ---
            const urlParams = new URLSearchParams(window.location.search);
            const resetToken = urlParams.get('token'); // 變量名改為 resetToken，避免與 CSRF Token 混淆

            if (!resetToken) {
                pageDescription.textContent = '無效或缺失的重設連結，請返回忘記密碼頁面重新申請。';
                pageDescription.style.color = 'red';
                resetPasswordForm.style.display = 'none';
                return;
            }

            // --- 區塊 2：密碼可視性切換 (完整版) ---
            document.querySelectorAll('.toggle-password').forEach(icon => {
                icon.addEventListener('click', function () {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            });

            // --- 區塊 3：密碼強度檢測 (完整版) ---
            newPasswordInput.addEventListener('input', function () {
                const password = this.value;
                passwordStrength.classList.toggle('show', password.length > 0);
                if (password.length === 0) {
                    strengthBar.className = 'strength-bar';
                    return;
                }
                let strength = 0;
                if (password.length >= 8) strength++;
                if (/[A-Z]/.test(password)) strength++;
                if (/[a-z]/.test(password)) strength++;
                if (/[0-9]/.test(password)) strength++;
                if (/[^A-Za-z0-9]/.test(password)) strength++;
                strengthBar.className = 'strength-bar';
                if (strength <= 2) strengthBar.classList.add('strength-weak');
                else if (strength <= 4) strengthBar.classList.add('strength-medium');
                else strengthBar.classList.add('strength-strong');
            });

            // --- 區塊 4：表單提交邏輯 (修正版：統一用 await 语法，避免 fetch 與 await 混用) ---
            resetPasswordForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                clearAllErrors();
                let isValid = true;

                // 1. 前端表單驗證
                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();
                const pwdRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\da-zA-Z]).{8,}$/;

                if (!pwdRegex.test(newPassword)) {
                    showError('newPasswordError', '密碼不符合要求，須包含大小寫、數字及特殊符號，且不少於8位');
                    isValid = false;
                } else if (newPassword !== confirmPassword) {
                    showError('confirmPasswordError', '兩次輸入的密碼不一致');
                    isValid = false;
                }

                if (!isValid) return;

                // 2. 禁用按鈕防止重複提交
                submitBtn.disabled = true;
                submitBtn.textContent = '重置中...';

                try {
                    // 3. 獲取 CSRF Token（與登錄頁輯一致）
                    const csrfResponse = await fetch('/api/csrf-token');
                    if (!csrfResponse.ok) {
                        throw new Error('無法獲取驗證信息，請稍後再試');
                    }
                    const csrfData = await csrfResponse.json();
                    const csrfToken = csrfData.token;
                    const csrfHeaderName = csrfData.headerName;

                    // 4. 發送重置密碼請求（攜帶 CSRF Token 和重置 Token）
                    const response = await fetch('/api/users/reset-password-with-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            [csrfHeaderName]: csrfToken // 核心：添加 CSRF Token 到請求頭
                        },
                        body: JSON.stringify({
                            token: resetToken, // 重置密碼的 Token（來自網址參數）
                            newPassword: newPassword,
                            confirmPassword: confirmPassword
                        })
                    });

                    // 5. 處理響應
                    if (!response.ok) {
                        // 後端返回錯誤（如 Token 過期、密碼不符合要求）
                        const errorData = await response.json();
                        throw errorData;
                    }

                    // 6. 重置成功邏輯
                    const successMessage = await response.text();
                    alert(successMessage || '密碼已成功重設！3秒後將跳轉至登入頁面...');
                    setTimeout(() => {
                        window.location.href = '/frontend-template/login.html';
                    }, 3000);

                } catch (error) {
                    // 7. 錯誤處理
                    console.error('重設密碼失敗:', error);
                    // 顯示後端返回的錯誤信息（如 Token 過期、密碼強度不足）
                    if (error.field && error.message) {
                        showError(error.field + 'Error', error.message);
                    } else {
                        pageDescription.textContent = error.message || '重設失敗，連結可能已過期或無效。';
                        pageDescription.style.color = 'red';
                    }

                } finally {
                    // 8. 無論成功/失敗，恢復按鈕狀態
                    submitBtn.disabled = false;
                    submitBtn.textContent = '確認重置密碼';
                }
            });
        });
    </script>
</body>

</html>
