<!-- pay.html -->
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>信用卡付款</title>
	<link rel="stylesheet" href="/frontend-template/assets/css/bootstrap.min.css">
</head>

<body class="container py-4">
	<h2 class="mb-3">信用卡付款</h2>
	<p>
		訂單編號：<span id="orderCode"></span>
	</p>

	<form id="payForm" novalidate>
		<div class="mb-3">
			<label class="form-label">卡號</label> <input class="form-control" name="cardNo"
				placeholder="4111 1111 1111 1111" required>
			<div class="invalid-feedback">請輸入卡號</div>
		</div>
		<div class="row g-3">
			<div class="col-md-6">
				<label class="form-label">有效年月</label> <input class="form-control" name="exp" placeholder="MM/YY"
					required>
				<div class="invalid-feedback">請輸入有效年月</div>
			</div>
			<div class="col-md-6">
				<label class="form-label">安全碼</label> <input class="form-control" name="cvv" maxlength="4" required>
				<div class="invalid-feedback">請輸入安全碼</div>
			</div>
		</div>
		<button class="btn btn-dark mt-3">確認送出</button>
	</form>

	<div id="msg" class="mt-3 text-danger"></div>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="/frontend-template/assets/js/custom.js"></script>

	<script src="/frontend-template/assets/js/api.js"></script>

	<script src="/frontend-template/assets/js/pay.js"></script>
</body>

</html>
