		<script src="/frontend-template/assets/js/jquery.min.js"></script>
		<script src="/frontend-template/assets/js/jquery.waypoints.min.js"></script>
		<script src="/frontend-template/assets/js/jquery.counterup.min.js"></script>

		<script src="/frontend-template/assets/js/api.js"></script>
		<script src="/frontend-template/assets/js/custom.js"></script>
		<script src="/frontend-template/assets/js/loader.js"></script>

		<script src="/frontend-template/assets/vendor/bs-stepper/bs-stepper.min.js"></script>
		<script src="/frontend-template/assets/vendor/moment/moment.min.js"></script>
		<script src="/frontend-template/assets/vendor/fl-calendar/index.global.js"></script>
		<script src="/frontend-template/assets/vendor/api/sport-api.js"></script>
		<script src="/frontend-template/assets/vendor/api/csrf-api.js"></script>
		<script>
			// ------ 全域狀態 ------
			const API_MAP = {
				getSidebar: BASE_API_URL + "/sportSidebar/api/fd/sidebar",
				getSportTypeList:
					BASE_API_URL +
					'/sportType/api/fd/getMultipleBySportTypeDataStatusesWithSportDataStatuses',
				insertWorkoutPlan:
					BASE_API_URL + '/workoutPlan/api/insertMultiple',
				getCustomSportList:
					BASE_API_URL +
					'/customSport/api/getMultipleBySportDataStatuses',
				insertCustomSport:
					BASE_API_URL + '/customSport/api/insertMultiple',
				updateCustomSport:
					BASE_API_URL + '/customSport/api/updateMultiple',
				deleteCustomSport:
					BASE_API_URL +
					'/customSport/api/updateMultipleSportDataStatus',
				fileImgUpload: BASE_API_URL + '/fileImg/api/fd/upload',
				fileImgUpdate: BASE_API_URL + '/fileImg/api/fd/update'
			};

			const PIC_MAP = {
				sportType: BASE_API_URL + '/sportPics/img/fd/sportType/',
				sport: BASE_API_URL + '/sportPics/img/fd/sport/',
				customSport: BASE_API_URL + '/sportPics/img/fd/customSport/',
				sportCommon: BASE_API_URL + '/sportPics/img/fd/sportCommon/'
			};

			// 上傳圖片
			async function uploadFileImg(funcType, file) {
				let formData = new FormData();
				formData.append('funcType', funcType);
				formData.append('file', file);

				const { retResult, retData, retMsg } = await csrfSafeCallAPI(
					API_MAP.fileImgUpload,
					{
						method: 'POST',
						body: formData
					}
				);
				// 由外部判斷是否跳提示
				return retData;
			}
			// 更新圖片
			async function updateFileImg(funcType, oldFileName, file) {
				let formData = new FormData();
				formData.append('funcType', funcType);
				formData.append('oldFileName', oldFileName);
				formData.append('newFile', file);

				const { retResult, retData, retMsg } = await csrfSafeCallAPI(
					API_MAP.fileImgUpdate,
					{
						method: 'POST',
						body: formData
					}
				);
				// 由外部判斷是否跳提示
				return retData;
			}

			let stepper;
			// 儲存分類與其底下運動（方便第二步渲染）
			let sportTypesList = []; 
			// 已選分類
			let selectedTypeId = null; 
			let lastSelectedTypeId = null;
			// 'system' | 'custom'
			let selectedSportFrom = null; 
			// 系統運動 sportId
			let selectedSportId = null; 
			// 自訂義運動 customSportId
			let selectedCustomSportId = null;
			// [{date:'YYYY-MM-DD', time:null, notify:0}, ...]
			let selectedDates = [];
			// 存放自訂義運動清單
			let currentCustomSports = [];
			let currSidebar = null;

			// ------ 初始化 Stepper & 載入分類 ------
			document.addEventListener('DOMContentLoaded', async function () {
				// 取得sidebar
				const { retResult, retData, retMsg } = await csrfSafeCallAPI(
					API_MAP.getSidebar,
					{
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({})
					}
				);
				if (retResult) {
					console.log(
						'workoutPlan_main sidebar success'
					);
					currSidebar = retData?.uudd || null;
				} else {
					console.error(
						'workoutPlan_main sidebar error retMsg: ',
						retMsg
					);
					currSidebar = null;
				}
				
				
				stepper = new Stepper(
					document.querySelector('#uni-add-plan-stepper'),
					{ linear: true, animation: true }
				);
				stepper.to(1);


				// 載入分類
				loadSportTypes();

				// 綁定下一步/上一步的防呆
				document
					.getElementById('btnStep1Next')
					.addEventListener('click', () => {
						if (!selectedTypeId) {
							alert('請先選擇分類');
							return;
						}
						stepper.next();
					});

				document
					.getElementById('btnStep2Prev')
					.addEventListener('click', () => stepper.previous());
				document
					.getElementById('btnStep2Next')
					.addEventListener('click', () => {
						// 確保變數和 DOM 同步
						const activeCard = document.querySelector('#sportList .uni-sport-card.border-theme-red');
						if (activeCard) {
						  selectedSportId = Number(activeCard.getAttribute('data-sport-id')) || null;
						  selectedCustomSportId = Number(activeCard.getAttribute('data-custom-id')) || null;
						}
						
						console.log(
							'btnStep2Next click: ',
							selectedSportFrom,
							selectedSportId,
							selectedCustomSportId
						);
						
						if (
							selectedSportFrom === 'system' &&
							!selectedSportId
						) {
							alert('請先選擇一個系統運動');
							return;
						}
						if (
							selectedSportFrom === 'custom' &&
							!selectedCustomSportId
						) {
							alert('請先選擇一個自訂義運動');
							return;
						}
						initCalendarIfNeeded();
						stepper.next();
					});

				document
					.getElementById('btnStep3Prev')
					.addEventListener('click', () => stepper.previous());
				document
					.getElementById('btnStep3Next')
					.addEventListener('click', () => {
						if (selectedDates.length === 0) {
							alert('請至少選擇一個日期');
							return;
						}

						// 驗證: 如果要提醒，需有時間
						let validateResult = true;
						let invalidObj = null;
						validateResult = selectedDates.every((obj) => {
							const ok = !(obj.notify === 1 && !obj.time);
							if (!ok && !invalidObj) {
								invalidObj = obj;
							}
							return ok;
						});

						if (!validateResult) {
							alert(invalidObj.date + ' 如提醒開啟，需填時間');
							return;
						}

						stepper.next();
					});

				document
					.getElementById('btnStep4Prev')
					.addEventListener('click', () => stepper.previous());
				document
					.getElementById('btnPlanCancel')
					.addEventListener('click', () => {
						console.log('點取消新增計畫');
						window.location.href = '/dMain/fd/workoutPlan_main';
					});

				// ------ Step3：一鍵控制提醒與時間 ------
				document
					.getElementById('btnAllNotifyOn')
					.addEventListener('click', () => {
						selectedDates.forEach((d) => (d.notify = 1));
						refreshSelectedDatesUI();
					});
				document
					.getElementById('btnAllNotifyOff')
					.addEventListener('click', () => {
						selectedDates.forEach((d) => (d.notify = 0));
						refreshSelectedDatesUI();
					});

				document
					.getElementById('inputAllTimeClear')
					.addEventListener('click', () => {
						const t = document.getElementById('inputAllTime').value;
						if (t) {
							// 清空時間
							document.getElementById('inputAllTime').value = '';
						}
					});

				document
					.getElementById('btnApplyAllTime')
					.addEventListener('click', () => {
						const t = document.getElementById('inputAllTime').value;
						if (!t) {
							// 清空所有時間
							selectedDates.forEach((d) => (d.time = null));
						} else {
							selectedDates.forEach((d) => (d.time = t));
						}
						refreshSelectedDatesUI();
					});

				// document
				// 	.getElementById('btnClearAllDates')
				// 	.addEventListener('click', () => {
				// 		selectedDates = [];
				// 		document
				// 			.querySelectorAll('.fc-daygrid-day')
				// 			.forEach((cell) => {
				// 				cell.classList.remove('uni-cal-is-pick');
				// 			});
				// 		refreshSelectedDatesUI();
				// 	});

				// 送出新增計畫
				document
					.getElementById('planForm')
					.addEventListener('submit', submitPlans);

				// 新增自訂義運動 確定按鈕
				document
					.getElementById('addCustomSportConfirmBtn')
					.addEventListener('click', onCreateCustomSport);

				// ------ Stepper 顯示事件，修正 Step3 日曆尺寸 ------
				document
					.querySelector('#uni-add-plan-stepper')
					.addEventListener('shown.bs-stepper', function (event) {
						if (
							document
								.getElementById('step-3')
								?.classList.contains('active') &&
							calendarInstance
						) {
							setTimeout(() => {
								try {
									calendarInstance.updateSize();
								} catch (e) {}
							}, 50);
						}
					});
			});

			// ------ Step1：載入分類 ------
			async function loadSportTypes() {
				const { retResult, retData, retMsg } = await csrfSafeCallAPI(
					API_MAP.getSportTypeList,
					{
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							sportTypeDataStatuses: [1], // 分類狀態
							sportDataStatuses: [1] // 運動狀態
						})
					}
				);
				if (retResult) {
					sportTypesList = retData || [];
				} else {
					console.error(
						'workoutPlan_addPlan loadSportTypes error retMsg: ',
						retMsg
					);
					sportTypesList = [];
				}

				const host = document.getElementById('sportTypeList');
				host.innerHTML = '';

				// 根據資料生成「col-12 > .uni-sport-type > .uni-sport-type-card」
				sportTypesList.forEach((type) => {
					const col = document.createElement('div');
					col.className = 'col-12';
					col.innerHTML = `
						<div class="uni-sport-type mb-4">
							<div class="uni-sport-type-card cursor-pointer" data-type-id="${type.sportTypeId}">
							<div class="uni-image-block">
								<img src="${type.sportTypePic ? PIC_MAP['sportType'] + type.sportTypePic : PIC_MAP['sportCommon'] + 'none.png'}"/>
							</div>
							<div class="uni-type-content-block">
								<div class="uni-type-name">${type.sportTypeName}</div>
								<div>
									${type.sportTypeId === 3 ? '[ 自訂義運動 ]' : '[ 系統運動 ]'}
								</div>
								<p class="uni-type-description" style="font-size: 14px;">
								更新：${type.updateDatetime || ''}
								</p>
							</div>
							<div class="uni-type-go-icon-block">
								<a class="uni-type-go-icon"><i class="fa-solid fa-angles-right"></i></a>
							</div>
							</div>
						</div>`;
					host.appendChild(col);
				});

				// 點擊事件
				host.querySelectorAll('.uni-sport-type-card').forEach(
					(card) => {
						card.addEventListener('click', () => {
							const typeId = Number(
								card.getAttribute('data-type-id')
							);
							selectedTypeId = typeId;
							
							// 樣式高亮
							host.querySelectorAll(
								'.uni-sport-type-card'
							).forEach((c) => c.classList.remove('active'));
							card.classList.add('active');


							if (typeId === 3) {
								// 自訂義分類
								loadCustomSports(typeId);
								selectedSportFrom = 'custom';
							} else {
								// 系統運動
								renderSystemSportsByTypeId(typeId);
								selectedSportFrom = 'system';
							}

							stepper.to(2);
							setTimeout(() => restoreSelectedHighlight(), 200);
						});
					}
				);
			}

			// ------ Step2：渲染系統運動（使用 step1 cache 中的 sportTypeItemResponseDTOs） ------
			function renderSystemSportsByTypeId(typeId) {
				const typeObj = sportTypesList.find(
					(t) => t.sportTypeId === typeId
				);
				const listEl = document.getElementById('sportList');
				const customArea = document.getElementById('customCreateArea');
				const customHint = document.getElementById('customEmptyHint');
				
				

				// 切換到新分類 時做清理 (避每次render清)
				if (String(selectedTypeId) !== String(lastSelectedTypeId) || selectedSportFrom !== 'system') {
				  selectedSportId = null;
				  selectedCustomSportId = null;
				}
				selectedSportFrom = 'system';
				
				
				lastSelectedTypeId = typeId;
				

				// 處理標頭
				const step2Center = $('#step2CenterBlock');
				if (step2Center) {
					let htmlStr = `
						<div class="d-flex justify-content-center">
							<div>
								步驟2： 選擇「 一項 」運動
							</div>
						</div>
						<div class="d-flex flex-column justify-content-center align-items-center">
							<span class="uni-hint">選擇想要的運動卡片後 (顯示紅框)，點選下一步按鈕</span>
						</div>
					`;
					step2Center.html(htmlStr);
				}

				// 處理資料
				listEl.innerHTML = '';
				customArea.classList.add('d-none');
				customHint.classList.add('d-none');

				if (!typeObj) {
					listEl.innerHTML =
						'<div class="col-12 text-center py-3">請上一步先選擇分類 (´-﹏-`；)</div>';
					return;
				}

				if (
					!Array.isArray(typeObj.sportResponseDTOs) ||
					(typeObj.sportResponseDTOs || []).length === 0
				) {
					listEl.innerHTML =
						'<div class="col-12 text-center py-3">此分類尚無運動，請上一步重新選擇分類，運動們coming soon~ (´-﹏-`；)</div>';
					return;
				}

				typeObj.sportResponseDTOs.forEach((sportResponseDTO) => {
					const s = { ...sportResponseDTO };
					const col = document.createElement('div');
					col.className = 'col-lg-6 col-sm-12';
					col.innerHTML = `
						<div class="uni-sport-card cursor-pointer" data-sport-id="${s.sportId}">
							<div class="d-flex align-items-center">
							<div class="uni-card-l">
								<div class="uni-card-title-block">
								<div class="uni-card-title" title="${s.sportName}">${s.sportName}</div>
								</div>
								<div class="d-flex align-items-center">
								<div class="uni-card-sport-from pe-3"><i class="pe-2 fa-solid fa-bowling-ball"></i>系統運動</div>
								<div class="uni-card-sport-level"><i class="pe-2 fa-solid fa-stairs"></i>${s.sportLevelText || ''}</div>
								</div>
								<div class="uni-card-sport-calories">
								<i class="uni-theme-color pe-2 fa-solid fa-fire"></i>
								<span class="counter uni-card-sport-calories-num">${s.sportEstimatedCalories || 0}</span> 大卡 / 小時
								</div>
							</div>
							<div class="uni-card-r">
								<div class="uni-card-sport-img-block">
								<img src="${s.sportPic ? PIC_MAP['sport'] + s.sportPic : PIC_MAP['sportCommon'] + 'none.png'}" class="uni-card-sport-img"/>
								</div>
							</div>
							</div>
							<div class="uni-card-sport-description-block">
							<p class="uni-card-sport-description" title="${s.sportDescription}">${s.sportDescription || ''}</p>
							</div>
						</div>`;
					listEl.appendChild(col);
				});

				// system click select
				listEl.querySelectorAll('.uni-sport-card').forEach((card) => {
					card.addEventListener('click', () => {
						selectedSportId = Number(
							card.getAttribute('data-sport-id')
						);
						selectedCustomSportId = null;

						console.log('selectedSportId choose: ', selectedSportFrom, selectedSportId, selectedCustomSportId);

						// 樣式高亮
						listEl
							.querySelectorAll('.uni-sport-card')
							.forEach((c) =>
								c.classList.remove(
									'border',
									'border-3',
									'border-theme-red'
								)
							);
						card.classList.add(
							'border',
							'border-3',
							'border-theme-red'
						);
					});
				});
			}

			// ------ Step2：載入自訂義運動 ------

			// ------ Step2：新增自訂義運動（Modal） ------
			async function onCreateCustomSport(e) {
				e.preventDefault();
				const name = document
					.getElementById('customSportName')
					.value.trim();
				const desc = document
					.getElementById('customSportDesc')
					.value.trim();
				const cal = Number(
					document.getElementById('customSportCalories').value
				);
				const calStr = (
					document.getElementById('customSportCalories').value || ''
				).trim();

				if (!name) {
					alert('名稱必填');
					return;
				}
				if (!desc) {
					alert('描述必填');
					return;
				}

				// 驗證 消耗卡路里 kcal) 必須為大於 0 的正整數，不能有小數點
				if (
					!/^[1-9]\d*$/.test(calStr) ||
					calStr.includes('.') ||
					calStr.endsWith('.')
				) {
					alert(
						'消耗卡路里需為大於 0 的正整數，不能有小數點或小數點結尾'
					);
					return;
				}

				// 圖片處理
				const fileInput = $('#addCustomSportPic')[0];
				let picBase64 = null;
				let file = null;
				if (fileInput && fileInput.files && fileInput.files[0]) {
					file = fileInput.files[0];

					if (!file.type.startsWith('image/')) {
						alert('請上傳圖片檔案 (jpg/jpeg/png)');
						return;
					}
					if (file.size > 4 * 1024 * 1024) {
						alert('圖片大小不得超過 4MB');
						return;
					}

					picBase64 = await new Promise((resolve, reject) => {
						const reader = new FileReader();
						reader.onload = (e) => resolve(e.target.result);
						reader.onerror = () => {
							alert('圖片讀取失敗，請重新選擇');
							reject(null);
						};
						reader.readAsDataURL(file);
					});
				}

				let uploadResult = null;
				if (file) {
					uploadResult = await uploadFileImg('customSport', file);
					if (!uploadResult || !uploadResult?.fileName) {
						alert('圖片上傳失敗');
						return;
					}
				}

				console.log('uploadResult', uploadResult);

				const { retResult, retData, retMsg } = await csrfSafeCallAPI(
					API_MAP.insertCustomSport,
					{
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							sports: [
								{
									customSportId: null,
									sportName: name,
									sportDescription: desc,
									sportEstimatedCalories: cal,
									sportPic: uploadResult?.fileName || null,
									sportDataStatus: 1,
									userId: currSidebar
								}
							]
						})
					}
				);
				if (retResult) {
					// 關閉 modal & 清空表單 & 重新載入列表
					const modalEl = document.getElementById('customSportModal');
					bootstrap.Modal.getInstance(modalEl).hide();
					document.getElementById('addCustomSportForm').reset();
					await loadCustomSports();

					alert('新增成功');

					// 幫剛新增的項目加上高亮（第一筆），並儲存選中id值
					const firstCard = document.querySelector(
						'#sportList .uni-sport-card'
					);
					if (firstCard) {
						selectedCustomSportId = Number(
							firstCard.getAttribute('data-custom-id')
						);
						selectedSportId = null;
						selectedSportFrom = 'custom', 
						selectedTypeId = 3;
						lastSelectedTypeId = 3;

						firstCard.classList.add(
							'border',
							'border-3',
							'border-theme-red'
						);
					}
				} else {
					alert('新增失敗');
					console.error(
						'workoutPlan_addPlan insertCustomSport error: ',
						retMsg
					);
				}
			}

			$('#addCustomSportPic').on('change', function () {

			// ------ Step2：送出編輯自訂義運動 ------
			// $('#editCustomSportForm').on('submit', async function (e) {
			$('#editCustomSportConfirmBtn').on('click', async function (e) {
				console.log('送出編輯自訂義運動');
				e.preventDefault();
				const id = Number($('#editCustomSportId').val());
				const name = $('#editCustomSportName').val().trim();
				const desc = $('#editCustomSportDesc').val().trim();
				const cal = Number($('#editCustomSportCalories').val());
				const calStr = (
					$('#editCustomSportCalories').val() || ''
				).trim();

				if (!id) {
					alert('缺少運動 ID');
					return;
				}
				if (!name) {
					alert('名稱必填');
					return;
				}
				if (!desc) {
					alert('描述必填');
					return;
				}

				// 驗證 消耗卡路里 kcal) 必須為大於 0 的正整數，不能有小數點
				if (
					!/^[1-9]\d*$/.test(calStr) ||
					calStr.includes('.') ||
					calStr.endsWith('.')
				) {
					alert(
						'消耗卡路里需為大於 0 的正整數，不能有小數點或小數點結尾'
					);
					return;
				}

				// 圖片處理
				// 拿原圖名稱
				const editPicOriginalName = $('#editCustomSportPicOriginalName')
					.val()
					.trim();

				// 處理更新圖片
				const fileInput = $('#editCustomSportPic')[0];
				let picBase64 = null;
				let file = null;
				if (fileInput && fileInput.files && fileInput.files[0]) {
					file = fileInput.files[0];

					if (!file.type.startsWith('image/')) {
						alert('請上傳圖片檔案 (jpg/jpeg/png)');
						return;
					}
					if (file.size > 4 * 1024 * 1024) {
						alert('圖片大小不得超過 4MB');
						return;
					}

					picBase64 = await new Promise((resolve, reject) => {
						const reader = new FileReader();
						reader.onload = (e) => resolve(e.target.result);
						reader.onerror = () => {
							alert('圖片讀取失敗，請重新選擇');
							reject(null);
						};
						reader.readAsDataURL(file);
					});
				}

				let finalSendPic = null;
				let updateOrUploadResult = false;
				// 有原圖、有更新圖片
				if (editPicOriginalName && file) {
					// 更新上傳的圖片 (會刪除 原圖片)
					let updateResult = await updateFileImg(
						'customSport',
						editPicOriginalName,
						file
					);
					if (!updateResult || !updateResult?.fileName) {
						updateOrUploadResult = false;
					}

					console.log('updateResult', updateResult);
					finalSendPic = updateResult.fileName || null;

					updateOrUploadResult = true;
				} else if (!editPicOriginalName && file) {
					// 無原圖、有更新圖片
					// 直接上傳
					let uploadResult = await uploadFileImg('customSport', file);
					if (!uploadResult || !uploadResult?.fileName) {
						updateOrUploadResult = false;
					}

					console.log('uploadResult', uploadResult);
					finalSendPic = uploadResult.fileName || null;

					updateOrUploadResult = true;
				} else if (editPicOriginalName && !file) {
					// 有原圖、無更新圖片
					finalSendPic = editPicOriginalName;

					updateOrUploadResult = true;
				} else {
					// 無原圖、無更新圖片
					finalSendPic = null;

					updateOrUploadResult = true;
				}

				if (!updateOrUploadResult) {
					return;
				}

					API_MAP.updateCustomSport,
					{
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },

									customSportId: id,
									sportName: name,
									sportDescription: desc,
									sportEstimatedCalories: cal,
									sportPic: finalSendPic,
									sportDataStatus: 1,
									userId: currSidebar

					bootstrap.Modal.getInstance(

					).hide();
					await loadCustomSports();

					console.error(
						'workoutPlan_addPlan updateCustomSport error retMsg: ',
						retMsg
					);
					alert('更新失敗，請稍後再試');

			});

			// ------ Step3：FullCalendar 初始化 & 選擇日期管理 ------
			let calendarInited = false;
			let calendarInstance = null;
			function initCalendarIfNeeded() {
				if (calendarInited) {
					if (calendarInstance) {
						try {
							calendarInstance.updateSize();
						} catch (e) {}
					}
					return;
				}
				calendarInited = true;

				const todayDateStr = moment().format('YYYY-MM-DD');
				const calendarEl = document.getElementById(
					'workout_plan_choose_calendar'
				);

				calendarInstance = new FullCalendar.Calendar(calendarEl, {
					schedulerLicenseKey: 'GPL-My-Project-Is-Open-Source',
					headerToolbar: {
						left: '',
						center: 'title prev,next',
						right: ''
					},
					initialDate: todayDateStr,
					navLinks: false,
					nowIndicator: true,
					editable: false,
					selectable: true,
					dayMaxEvents: false,
					dateClick: function (info) {
						// toggle select
						const dateStr = info.dateStr;

						const idx = selectedDates.findIndex(
							(d) => d.date === dateStr
						);
						if (idx >= 0) {
							selectedDates.splice(idx, 1);
							info.dayEl.classList.remove('uni-cal-is-pick');
						} else {
							selectedDates.push({
								date: dateStr,
								time: null,
								notify: 0
							});
							info.dayEl.classList.add('uni-cal-is-pick');
						}
						refreshSelectedDatesUI();
					}
				});

				calendarInstance.render();
				setTimeout(() => {
					try {
						calendarInstance.updateSize();
					} catch (e) {}
				}, 0);
			}

			function refreshSelectedDatesUI() {
				document.getElementById('selectedCount').innerText = String(
					selectedDates.length
				);
				const list = document.getElementById('selectedDatesList');
				list.innerHTML = '';
				const datesSorted = selectedDates
					.slice()
					.sort((a, b) => a.date.localeCompare(b.date));
				datesSorted.forEach((d) => {
					const row = document.createElement('div');
					row.className =
						'selected-date-pill d-flex justify-content-between align-items-center gap-3 p-3 pt-2 pb-3 flex-wrap';
					row.innerHTML = `
						  	<div>
								<div class="uni-cal-choose-dates">${d.date}</div>
								<div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
									<div class="position-relative me-3" style="width:200px">
										<input type="time" class="form-control form-control-sm pe-4 date-time-input" style="min-width: 100px; max-width: 200px; height: 30px;" value="${d.time ? d.time : ''}"/>
										<span class="clear-time position-absolute top-50 end-0 translate-middle-y me-2 cursor-pointer" title="清空時間">&times;</span>
									</div>
									<div class="form-check form-switch m-0">
										<input class="form-check-input date-notify-switch" type="checkbox" ${d.notify ? 'checked' : ''}>
									</div>
								</div>
							</div>
							<div class="pe-2 pt-1">
								<button class="remove-btn" aria-label="移除此日期" title="移除此日期"><i class="fa-solid fa-xmark"></i></button>
							</div>
						`;

					// 綁定清空時間 (在時間輸入框內的 ×)
					row.querySelector('.clear-time').addEventListener(
						'click',
						() => {
							const obj = selectedDates.find(
								(x) => x.date === d.date
							);
							if (obj) obj.time = null;
							row.querySelector('.date-time-input').value = '';
						}
					);

					// 綁定刪除
					row.querySelector('.remove-btn').addEventListener(
						'click',
						() => {
							const idx = selectedDates.findIndex(
								(x) => x.date === d.date
							);
							if (idx >= 0) selectedDates.splice(idx, 1);
							document
								.querySelectorAll('.fc-daygrid-day')
								.forEach((cell) => {
									const cellDate =
										cell.getAttribute('data-date');
									if (!cellDate) return;
									if (
										selectedDates.some(
											(x) => x.date === cellDate
										)
									)
										cell.classList.add('uni-cal-is-pick');
									else
										cell.classList.remove(
											'uni-cal-is-pick'
										);
								});
							refreshSelectedDatesUI();
						}
					);
					// 綁定時間
					row.querySelector('.date-time-input').addEventListener(
						'change',
						(e) => {
							const obj = selectedDates.find(
								(x) => x.date === d.date
							);
							if (obj) obj.time = e.target.value || null;
						}
					);
					// 綁定提醒開關
					row.querySelector('.date-notify-switch').addEventListener(
						'change',
						(e) => {
							const obj = selectedDates.find(
								(x) => x.date === d.date
							);
							if (obj) obj.notify = e.target.checked ? 1 : 0;
						}
					);
					list.appendChild(row);
				});
			}

			// ------ 恢復已選擇的分類與運動高亮 ------
			function restoreSelectedHighlight() {
				// 分類
				if (selectedTypeId) {

								c.classList.remove('active');
							}
						});
				}
				// 運動
				if (selectedSportFrom === 'system' && selectedSportId) {
					document
						.querySelectorAll('#sportList .uni-sport-card')
						.forEach((c) => {
							if (
								Number(c.getAttribute('data-sport-id')) ===
								selectedSportId
							) {
								c.classList.add(
									'border',
									'border-3',
									'border-theme-red'
								);
							}
						});
				}
				// 自訂義運動
				if (selectedSportFrom === 'custom' && selectedCustomSportId) {
					document
						.querySelectorAll('#sportList .uni-sport-card')
						.forEach((c) => {
							if (
								Number(c.getAttribute('data-custom-id')) ===
								selectedCustomSportId
							) {
								c.classList.add(
									'border',
									'border-3',
									'border-theme-red'
								);
							}
						});
				}
			}

			// ------ Step4：送出 insertMultiple ------
			async function submitPlans(e) {
				e.preventDefault();
				if (selectedSportFrom === 'system' && !selectedSportId) {
					alert('第二步驟: 請選擇一項運動');

					stepper.to(2);
					setTimeout(() => restoreSelectedHighlight(), 200);

					return;
				}
				if (selectedSportFrom === 'custom' && !selectedCustomSportId) {
					alert('第二步驟: 請選擇一項自訂義運動');

					stepper.to(2);
					setTimeout(() => restoreSelectedHighlight(), 200);

					return;
				}
				if (selectedDates.length === 0) {
					alert('第三步驟: 請選擇至少一天');
					stepper.to(3);
					return;
				}

				const name = document.getElementById('planName').value.trim();
				const minutes = Number(
					document.getElementById('planMinutes').value
				);
				const minuteStr = document
					.getElementById('planMinutes')
					.value.trim();

				if (!name) {
					alert('請填寫計畫名稱');
					return;
				}
				// 驗證分鐘數：只能是大於 0 的正整數
				if (!/^[1-9]\d*$/.test(minuteStr)) {
					alert('分鐘數請填大於 0 的正整數');
					minuteInputEl.focus();
					return;
				}

				// 依規格：每個日期是一筆資料

				const list = selectedDates.map((d) => ({
					workoutPlanId: null,
					workoutPlanName: name,
					userId: currSidebar,
					sportFrom:
						selectedSportFrom === 'custom' ? 'custom' : 'system',
					sportId:
						selectedSportFrom === 'system' ? selectedSportId : null,
					customSportId:
						selectedSportFrom === 'custom'
							? selectedCustomSportId
							: null,
					workoutPlanDate: d.date,
					workoutPlanTime: d.time, // 可能是 null
					workoutPlanIsNotify: d.notify,
					workoutPlanExpectedDuration: minutes
				}));

				let { retResult, retData, retMsg } = await csrfSafeCallAPI(
					API_MAP.insertWorkoutPlan,
					{
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ list })
					}
				);
				if (retResult) {
					alert('已新增 ' + list.length + ' 筆計畫！');
					// 清空狀態
					resetWizard();
					window.location.href = '/dMain/fd/workoutPlan_main';
				} else {
					console.error(
						'workoutPlan_addPlan insertWorkoutPlan error retMsg: ',
						retMsg
					);
					alert('新增失敗，請稍後再試');
				}
			}

			function resetWizard() {
				selectedTypeId = null;
				selectedSportFrom = null;
				selectedSportId = null;
				selectedCustomSportId = null;
				selectedDates = [];
				document.getElementById('planForm').reset();
				document.getElementById('selectedDatesList').innerHTML = '';
				document.getElementById('selectedCount').innerText = '0';
				// 清掉第二步列表與高亮
				document.getElementById('sportList').innerHTML = '';
				// 回第一步並重新載入分類
				stepper.to(1);
				loadSportTypes();
				// 清除日曆選擇樣式
				document
					.querySelectorAll('.fc-daygrid-day')
					.forEach((cell) =>
						cell.classList.remove('uni-cal-is-pick')
					);
			}

			// ------ To ensure FullCalendar fills width when (re)entering Step 3 ------
			(function () {
				const stepperEl = document.querySelector(
					'#uni-add-plan-stepper'
				);
				if (!stepperEl) return;

				function ensureCalendarSized(attempts = 6) {
					if (!calendarInstance) return;
					try {
						calendarInstance.render();
					} catch (e) {}
					try {
						calendarInstance.updateSize();
					} catch (e) {}
					if (attempts > 1) {
						setTimeout(() => ensureCalendarSized(attempts - 1), 80);
					}
				}

				stepperEl.addEventListener(
					'shown.bs-stepper',
					function (event) {
						const idx =
							event && event.detail
								? event.detail.indexStep
								: undefined;
						const isStep3 =
							idx === 2 ||
							(document.getElementById('step-3') &&
								document
									.getElementById('step-3')
									.classList.contains('active'));
						if (isStep3 && calendarInstance) {
							// 確保在CSS過渡 / 隱藏容器時正常，排隊重新整理
							try {
								requestAnimationFrame(() =>
									ensureCalendarSized(1)
								);
							} catch (e) {
						       // requestAnimationFrame 可能不可用
							}
							setTimeout(() => ensureCalendarSized(1), 0);
							setTimeout(() => ensureCalendarSized(3), 120);
							setTimeout(() => ensureCalendarSized(2), 300);
						}
					}
				);

				// Also fix on window resize
				window.addEventListener('resize', function () {
					if (calendarInstance) {
						try {
							calendarInstance.updateSize();
						} catch (e) {}
					}
				});
			})();

		</script>
	</body>
</html>
