  <link rel="stylesheet" type="text/css" href="assets/css/style.css">

  <link rel="stylesheet" type="text/css" href="assets/css/responsive.css">

  <style>
    .social-item {
      display: flex;
      align-items: center;
      /* icon + 文字垂直置中 */
      gap: 8px;
      /* icon 與文字的間距 */
    }

    /* 讓 nav 區塊自己成為一條水平列：左(ul) + 右(登入) */
    .header-style-one .nav-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      /* 選配：ul 和 會員登入 的距離 */
      width: 100%;
    }

    /* 主選單 UL 吃滿中間空間，並在中間置中排列每個 LI */
    .header-style-one .nav-bar>ul {
      flex: 1 1 auto;
      /* 佔滿 Logo 與 登入鍵 之間的可用寬度 */
      display: flex;
      justify-content: center;
      /* 讓四個大項目置中 */
      gap: 28px;
      /* 項目間距，自行調整 */
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* 會員登入維持在最右邊 */
    .header-style-one .nav-bar .extras {
      flex: 0 0 auto;

    }

    /* 付款成功區塊：置中 + 放大 */
    .payment-success {
      min-height: 60vh;
      /* 有點高度，畫面居中好看 */
      display: flex;
      align-items: center;
      /* 垂直置中 */
      justify-content: center;
      /* 水平置中 */
      padding: 48px 0;
    }

    .payment-success .wrap {
      text-align: center;
      /* 內容置中 */
    }

    .payment-success .wrap img {
      width: min(90vw, 560px);
      /* 圖片自適應 */
      height: auto;
      margin: 0 auto 16px;
      display: block;
    }

    .payment-success .title {
      font-size: clamp(28px, 3.2vw, 40px);
      font-weight: 800;
      margin-top: 8px;
      margin-bottom: 6px;
      letter-spacing: .02em;
    }

    .payment-success .desc {
      font-size: clamp(16px, 2vw, 20px);
      opacity: .9;
      margin-bottom: 24px;
    }

    .payment-success .actions .theme-btn {
      /* 放大「回首頁」按鈕 */
      font-size: 18px;
      /* 文字變大 */
      padding: 12px 24px;
      /* 內距變大 */
      border-radius: 12px;
      /* 圓角（可選） */
    }

    /* 成功頁的回首頁按鈕：預設白字、hover 變黑字，且不被偽元素蓋住 */
    .payment-success .actions .pay-success-btn {
      color: #fff !important;
      /* 預設白字 */
      position: relative;
      /* 讓 z-index 可用 */
    }

    .payment-success .actions .pay-success-btn:hover,
    .payment-success .actions .pay-success-btn:focus {
      color: #000 !important;
      /* 滑過去變黑字 */
      text-decoration: none;
    }

    /* 主題常用 ::before/::after 做 hover 動畫，避免蓋住文字 */
    .payment-success .actions .pay-success-btn::before,
    .payment-success .actions .pay-success-btn::after {
      pointer-events: none;
      z-index: -1 !important;
    }
  </style>

</head>
