<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">運動任務 | Sports Task Badge</title>
  <desc id="desc">A clean, modern badge icon with a gradient card, a dumbbell representing sports, and a checkmark badge representing tasks or completion.</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.22"/>
    </filter>

    <!-- Inner shadow for card -->
    <filter id="inner" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k2="-1" k3="2"/>
    </filter>

    <!-- Check badge shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="32" y="32" width="448" height="448" rx="40" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="40" fill="white" fill-opacity="0.06" filter="url(#inner)"/>

  <!-- Dumbbell icon (center) -->
  <g transform="translate(0, -10)">
    <!-- Bar -->
    <rect x="140" y="240" width="232" height="32" rx="16" fill="white" opacity="0.95"/>
    <!-- Left plates -->
    <rect x="110" y="224" width="24" height="64" rx="8" fill="white" opacity="0.9"/>
    <rect x="90" y="232" width="18" height="48" rx="6" fill="white" opacity="0.8"/>
    <rect x="74" y="238" width="14" height="36" rx="5" fill="white" opacity="0.7"/>
    <!-- Right plates -->
    <rect x="378" y="224" width="24" height="64" rx="8" fill="white" opacity="0.9"/>
    <rect x="404" y="232" width="18" height="48" rx="6" fill="white" opacity="0.8"/>
    <rect x="422" y="238" width="14" height="36" rx="5" fill="white" opacity="0.7"/>
  </g>

  <!-- Check badge (top-right) -->
  <g transform="translate(330, 110)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="48" fill="url(#accent)"/>
    <path d="M48 72l16 16 32-36" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title text -->
  <g aria-hidden="true">
    <text x="256" y="420" text-anchor="middle"
          font-family="Segoe UI, Noto Sans TC, Arial, sans-serif"
          font-size="36" fill="white" font-weight="700" opacity="0.98">運動任務</text>
    <text x="256" y="452" text-anchor="middle"
          font-family="Segoe UI, Noto Sans, Arial, sans-serif"
          font-size="16" fill="white" opacity="0.9">Sports · Task</text>
  </g>
</svg>
