<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的文章</title>
<!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> -->
<!-- <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"> -->
<link rel="stylesheet" type="text/css"
	href="/frontend-template/assets/css/bootstrap.min.css">
<link rel="icon" type="image/x-icon"
	href="/frontend-template/assets/images/heading-icon.png">

<link rel="stylesheet" type="text/css"
	href="/frontend-template/assets/css/style.css">
<link rel="stylesheet" type="text/css"
	href="/frontend-template/assets/css/responsive.css">
<link rel="stylesheet" type="text/css"
	href="/frontend-template/assets/css/header.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body {
	background: #f5f5f5;
	font-family: Arial, sans-serif;
}

.container {
	margin-top: 20px;
	max-width: 900px;
}

/* 文章卡片 */
.article-card {
	background: #fff;
	padding: 20px;
	border-radius: 10px;
	box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
	margin-bottom: 20px;
	height: 1000px;           /* 固定高度 */
    overflow-y: auto;        /* 超過就捲動 */
}

.article-card h5 {
	border-left: 4px solid #c62828;
	padding-left: 8px;
	color: #c62828;
	margin-bottom: 15px;
}

/* 文章項目 */
.article-item {
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 12px 16px;
	border-bottom: 1px solid #eee;
	transition: opacity 0.3s ease, transform 0.3s ease;
}

.article-item:last-child {
	border-bottom: none;
}

.article-main {
	display: flex;
	align-items: center;
	gap: 16px;
}

.article-main img {
	width: 100px;
	height: 70px;
	object-fit: cover;
	border-radius: 6px;
}

.article-info h6 {
	margin: 0 0 4px;
	font-size: 1rem;
}

.article-info h6 a {
	color: #555;
	text-decoration: none;
	transition: 0.3s;
}

.article-info h6 a:hover {
	color: #c62828;
	text-decoration: underline;
}

.article-info p {
	margin: 0;
	font-size: 0.875rem;
	color: #666;
}

/* 按鈕群 */
.article-actions {
	display: flex;
	gap: 8px;
}

/* 刪除按鈕 */
.btn-remove {
	border-radius: 5px;
	font-size: 14px;
	display: flex;
	align-items: center;
	gap: 5px;
	color: #c62828;
	border: 1px solid #c62828;
	background: #fff;
	transition: 0.3s;
}

.btn-remove:hover {
	background: #c62828;
	color: #fff;
}

/* 編輯按鈕 */
.btn-edit {
	border-radius: 5px;
	font-size: 14px;
	display: flex;
	align-items: center;
	gap: 5px;
	color: #1976d2;
	border: 1px solid #1976d2;
	background: #fff;
	transition: 0.3s;
}

.btn-edit:hover {
	background: #1976d2;
	color: #fff;
}

/* 浮動回首頁按鈕 */
.btn-home-float {
	position: fixed;
	bottom: 20px;
	right: 20px;
	display: inline-flex;
	align-items: center;
	gap: 5px;
	padding: 10px 16px;
	border-radius: 30px;
	background: #c62828;
	color: #fff;
	font-weight: 500;
	text-decoration: none;
	box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
	transition: 0.3s;
	z-index: 999;
}

.btn-home-float:hover {
	background: #e53935;
}

/* 漸變消失效果 */
.fade-out {
	opacity: 0;
	transform: translateX(50px);
}
</style>
</head>
<body>
	<div id="header-placeholder"></div>

	<section class="banner-style-one">
		<div class="parallax"></div>
		<div class="container">
			<div class="row">
				<div class="banner-details">
					<h2>會員中心</h2>
					<p>歡迎回來！管理您的個人資料與服務</p>
				</div>
			</div>
		</div>
	</section>
	<div class="container">
		<!-- 我的文章卡片 -->
		<div class="article-card">
			<h5>我的文章列表</h5>
			<div id="articleList"></div>
		</div>
	</div>

	<!-- 浮動回首頁按鈕 -->
	<a href="/frontend-template/forum.html" class="btn-home-float"><i
		class="fas fa-home"></i> 回討論區</a>

	<script>
document.addEventListener("DOMContentLoaded", function() {

    function loadArticles() {
        fetch('/api/myarticles')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('articleList');
                list.innerHTML = '';

                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="text-muted">目前沒有文章</p>';
                    return;
                }

                data.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'article-item';
                    row.dataset.id = item.articleId;

                    const mainDiv = document.createElement('div');
                    mainDiv.className = 'article-main';
                    mainDiv.innerHTML = `
                        <img src="${item.coverImageUrl||'/images/default.jpg'}" alt="封面">
                        <div class="article-info">
                            <h6><a href="article-detail.html?id=${item.articleId}">${item.title}</a></h6>
                            <p class="small">發布於：${item.createTime} | 👁 ${item.views} 次瀏覽</p>
                        </div>
                    `;

                    const actionDiv = document.createElement('div');
                    actionDiv.className = 'article-actions';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'btn-edit';
                    editBtn.innerHTML = '<i class="fas fa-edit"></i> 編輯';
                    // 修改這裡，導向 post-article.html
                    editBtn.addEventListener('click', () => {
                        window.location.href = `post-article.html?id=${item.articleId}`;
                    });

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn-remove';
                    removeBtn.innerHTML = '<i class="fas fa-trash-alt"></i> 刪除';
                    removeBtn.addEventListener('click', () => {
                        if (!confirm('確定要刪除文章嗎？')) return;

                        fetch(`/api/myarticles/${item.articleId}`, { method: 'DELETE' })
                            .then(res => {
                                if (!res.ok) throw new Error('刪除失敗');
                                row.classList.add('fade-out');
                                setTimeout(() => {
                                    row.remove();
                                    if (document.querySelectorAll('.article-item').length === 0) {
                                        list.innerHTML = '<p class="text-muted">目前沒有文章</p>';
                                    }
                                }, 300);
                            })
                            .catch(err => {
                                alert('刪除文章失敗，請稍後再試');
                                console.error(err);
                            });
                    });

                    actionDiv.appendChild(editBtn);
                    actionDiv.appendChild(removeBtn);

                    row.appendChild(mainDiv);
                    row.appendChild(actionDiv);
                    list.appendChild(row);
                });
            });
    }

    // 載入文章
    loadArticles();
});
</script>
	<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script> -->
	<!--  頁尾 -->
	<div id="footer-placeholder"></div>
	<!-- ======================= 唯一修改點：會員中心腳本 ======================= -->
	<script src="/frontend-template/assets/js/jquery.min.js"></script>
	<script src="/frontend-template/assets/js/bootstrap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="/frontend-template/assets/js/api.js"></script>
	<script src="/frontend-template/assets/js/loader.js"></script>
	<script src="/frontend-template/assets/js/custom.js"></script>
	<script src="/frontend-template/assets/js/profile.js"></script>
</body>
</html>
